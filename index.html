    function loadActivities() { try { const saved = localStorage.getItem(STORAGE_KEY); const parsed = saved ? JSON.parse(saved) : []; return Array.isArray(parsed) ? parsed : []; } catch { return []; } }
    function saveActivities() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(activities)); } catch {} }

    function normalizeWholeBranchManualActivities(items) {
      const migratedBranchLines = new Set();
      return items.flatMap(activity => {
        if (activity.source !== 'manual' || !Array.isArray(activity.appliedSegments)) return [activity];
        const branchInfo = activity.appliedSegments.find(segment =>
          lineStates.get(segment.lineId)?.definition.kind === 'branch'
        );
        if (!branchInfo) return [activity];
        if (migratedBranchLines.has(branchInfo.lineId)) return [];

        const state = lineStates.get(branchInfo.lineId);
        const totalLength = Number(state?.definition.meters);
        if (!state || !Number.isFinite(totalLength)) return [activity];
        migratedBranchLines.add(branchInfo.lineId);
        return [{
          ...activity,
          startCamera: state.definition.from,
          endCamera: state.definition.to,
          length: totalLength,
          appliedLength: totalLength,
          appliedSegments: [{ lineId: branchInfo.lineId, segmentIndex: 0, segmentLength: totalLength }]
        }];
      });
    }

    function normalizeConstructionOrderActivities(items) {
      return items.map(activity => {
        if (Number(activity.segmentOrderVersion) >= ACTIVITY_SEGMENT_ORDER_VERSION) return activity;
        const appliedSegments = Array.isArray(activity.appliedSegments)
          ? activity.appliedSegments.map(segment => {
              const state = lineStates.get(segment.lineId);
              const definition = state?.definition;
              if (!state || !collectorSegmentsRunAgainstPath(definition)) return { ...segment };
              const oldIndex = Number(segment.segmentIndex);
              if (!Number.isInteger(oldIndex)) return { ...segment };
              const newIndex = state.segmentLengths.length - 1 - oldIndex;
              if (newIndex < 0 || newIndex >= state.segmentLengths.length) return { ...segment };
              return {
                ...segment,
                segmentIndex: newIndex,
                segmentLength: state.segmentLengths[newIndex]
              };
            })
          : activity.appliedSegments;
        return {
          ...activity,
          segmentOrderVersion: ACTIVITY_SEGMENT_ORDER_VERSION,
          appliedSegments
        };
      });
    }

    function findPathBetweenCameras(startCamera, endCamera) {
      const queue = [{ camera:startCamera, path:[] }]; const visited = new Set([startCamera]);
      while (queue.length) {
        const current = queue.shift();
        if (current.camera === endCamera) return current.path;
        routeEdges.forEach(edge => {
          let next = null, forward = true;
          if (edge.from === current.camera) { next = edge.to; forward = true; }
          else if (edge.to === current.camera) { next = edge.from; forward = false; }
          if (!next || visited.has(next)) return;
          visited.add(next);
          queue.push({ camera:next, path: current.path.concat({ lineId:edge.lineId, forward }) });
        });
      }
      return null;
    }

    function getAvailableLength(startCamera, endCamera) {
      const path = findPathBetweenCameras(startCamera, endCamera);
      if (!path) {
        return { ok: false, availableLength: 0, message: 'No existe una ruta entre esas dos cámaras en la red actual.' };
      }

      let availableLength = 0;
      for (const step of path) {
        const state = lineStates.get(step.lineId);
        if (!state || !hasKnownLength(state.definition)) {
          return { ok: false, availableLength: 0, message: `Falta definir la longitud de ${state?.definition?.name || step.lineId}.` };
        }
        state.segmentLengths.forEach((segmentLength, segmentIndex) => {
          if (state.activitySegmentCount[segmentIndex] === 0 && Number.isFinite(Number(segmentLength))) {
            availableLength += Number(segmentLength);
          }
        });
      }
      return { ok: true, path, availableLength: Number(availableLength.toFixed(2)) };
    }

    function computeAppliedSegments(startCamera, endCamera, requestedLength) {
      const path = findPathBetweenCameras(startCamera, endCamera);
      if (!path) return { ok:false, message:'No existe una ruta entre esas dos cámaras en la red actual.' };
      let remaining = requestedLength;
      let appliedLength = 0;
      const appliedSegments = [];
      outerLoop:
      for (const step of path) {
        const state = lineStates.get(step.lineId);
        if (!state || !hasKnownLength(state.definition)) {
          return { ok:false, message:`Falta definir la longitud de ${state?.definition?.name || step.lineId}.` };
        }
        const indexes = step.forward ? state.segmentLengths.map((_,i)=>i) : state.segmentLengths.map((_,i)=>i).reverse();
        for (const segmentIndex of indexes) {
          const segmentLength = Number(state.segmentLengths[segmentIndex]);
          if (!Number.isFinite(segmentLength)) continue;
          if (state.activitySegmentCount[segmentIndex] > 0) continue;
          if (remaining + 1e-9 >= segmentLength) {
            appliedSegments.push({ lineId:step.lineId, segmentIndex, segmentLength });
            remaining -= segmentLength;
            appliedLength += segmentLength;
          } else {
            break outerLoop;
          }
        }
      }
      return { ok:true, path, appliedSegments, appliedLength:Number(appliedLength.toFixed(2)) };
    }

    function clearAllVisualMarks() { lineStates.forEach(state => { state.activitySegmentCount = state.activitySegmentCount.map(() => 0); refreshLine(state); }); }
    function applyActivityVisualMarks(activity) {
      if (!Array.isArray(activity.appliedSegments)) return;
      const touched = new Set();
      activity.appliedSegments.forEach(info => {
        const state = lineStates.get(info.lineId); if (!state) return; const idx = info.segmentIndex;
        if (idx < 0 || idx >= state.activitySegmentCount.length) return;
        state.activitySegmentCount[idx] += 1; touched.add(info.lineId);
      });
      touched.forEach(id => refreshLine(lineStates.get(id)));
    }

    function calculateLineProgress(kind) {
      let completedLength = 0;
      let totalLength = 0;
      let missingCount = 0;

      lineStates.forEach(state => {
        if (state.definition.kind !== kind) return;
        if (!hasKnownLength(state.definition)) {
          missingCount += 1;
          return;
        }

        totalLength += Number(state.definition.meters);
        state.segmentLengths.forEach((segmentLength, segmentIndex) => {
          if (!isSegmentActive(state, segmentIndex)) return;
          const value = Number(segmentLength);
          if (Number.isFinite(value)) completedLength += value;
        });
      });

      completedLength = Math.min(completedLength, totalLength);
      const percentage = totalLength > 0 ? completedLength / totalLength * 100 : 0;
      return {
        completedLength: Number(completedLength.toFixed(2)),
        totalLength: Number(totalLength.toFixed(2)),
        percentage: Number(percentage.toFixed(2)),
        missingCount
      };
    }

    function renderProgressDonut(donut, text, progress, label) {
      const percentage = Math.max(0, Math.min(100, Math.round(progress.percentage)));
      const pendingPercentage = 100 - percentage;
      donut.style.setProperty('--progress', `${percentage}%`);
      donut.setAttribute(
        'aria-label',
        `${label}: ${percentage} % avanzado y ${pendingPercentage} % pendiente${progress.missingCount > 0 ? ' sobre longitudes conocidas' : ''}`
      );
      text.textContent = `${percentage}%`;
    }

    function updateProgressPanel() {
      const collectorProgress = calculateLineProgress('collector');
      const branchProgress = calculateLineProgress('branch');
      renderProgressDonut(collectorProgressDonut, collectorProgressText, collectorProgress, 'Colectores');
      renderProgressDonut(branchProgressDonut, branchProgressText, branchProgress, 'Tirantes');
      collectorProgressWarning.hidden = collectorProgress.missingCount === 0;
      collectorProgressWarning.textContent = collectorProgress.missingCount === 1
        ? 'Falta por definir 1 longitud de colector.'
        : `Faltan por definir ${collectorProgress.missingCount} longitudes de colectores.`;
      branchProgressWarning.hidden = branchProgress.missingCount === 0;
      branchProgressWarning.textContent = branchProgress.missingCount === 1
        ? 'Falta por definir 1 longitud de tirante.'
        : `Faltan por definir ${branchProgress.missingCount} longitudes de tirantes.`;
    }

    function rebuildActivityMarks() {
      clearAllVisualMarks();
      activities.forEach(activity => {
        if (activity.source === 'manual') {
          if (!Array.isArray(activity.appliedSegments)) activity.appliedSegments = [];
          const known = activity.appliedSegments
            .map(segment => Number(segment.segmentLength))
            .filter(Number.isFinite);
          activity.appliedLength = known.length ? Number(known.reduce((sum, value) => sum + value, 0).toFixed(2)) : null;
          applyActivityVisualMarks(activity);
          return;
        }
        if (activity.source === 'manualNode') return;
        const result = computeAppliedSegments(activity.startCamera, activity.endCamera, activity.length);
        if (result.ok) {
          activity.appliedSegments = result.appliedSegments;
          activity.appliedLength = result.appliedLength;
          applyActivityVisualMarks(activity);
        } else {
          activity.appliedSegments = [];
          activity.appliedLength = 0;
        }
      });
      saveActivities();
      updateProgressPanel();
      checkVictory();
    }

    function setGroupActivitiesMessage(message='', type='') {
      groupActivitiesMessage.textContent = message;
      groupActivitiesMessage.classList.toggle('error', type === 'error');
      groupActivitiesMessage.classList.toggle('success', type === 'success');
    }

    function updateGroupActivitiesButton() {
      const selectedManualCount = activities.filter(activity =>
        activity.source === 'manual' && selectedActivityIds.has(activity.id)
      ).length;
      const disabled = selectedManualCount < 2;
      groupActivitiesButton.classList.toggle('is-disabled', disabled);
      groupActivitiesButton.setAttribute('aria-disabled', disabled ? 'true' : 'false');
    }

    function groupSelectedActivities() {
      const selected = activities.filter(activity => selectedActivityIds.has(activity.id));
      if (selected.length < 2) {
        setGroupActivitiesMessage('Selecciona al menos dos actividades manuales.', 'error');
        return;
      }
      if (selected.some(activity => activity.source !== 'manual')) {
        setGroupActivitiesMessage('Solo se pueden agrupar actividades marcadas manualmente.', 'error');
        return;
      }

      const first = selected[0];
      if (selected.some(activity =>
        activity.startCamera !== first.startCamera ||
        activity.endCamera !== first.endCamera
      )) {
        setGroupActivitiesMessage('Las actividades deben pertenecer al mismo tramo y tener la misma dirección.', 'error');
        return;
      }
      if (selected.some(activity => (activity.date || '') !== (first.date || ''))) {
        setGroupActivitiesMessage('Las actividades deben tener la misma fecha.', 'error');
        return;
      }

      const segments = selected.flatMap(activity =>
        Array.isArray(activity.appliedSegments) ? activity.appliedSegments : []
      );
      const lineIds = new Set(segments.map(segment => segment.lineId));
      if (!segments.length || lineIds.size !== 1) {
        setGroupActivitiesMessage('Las actividades deben corresponder a una misma tubería.', 'error');
        return;
      }
      if (segments.some(segment => !Number.isFinite(Number(segment.segmentLength)))) {
        setGroupActivitiesMessage('Define primero la longitud de todos los segmentos seleccionados.', 'error');
        return;
      }

      const orderedSegments = [...segments].sort((a,b) => a.segmentIndex - b.segmentIndex);
      const uniqueIndexes = new Set(orderedSegments.map(segment => segment.segmentIndex));
      const areConsecutive = uniqueIndexes.size === orderedSegments.length && orderedSegments.every((segment, index) =>
        index === 0 || segment.segmentIndex === orderedSegments[index - 1].segmentIndex + 1
      );
      if (!areConsecutive) {
        setGroupActivitiesMessage('Selecciona segmentos consecutivos para poder agruparlos.', 'error');
        return;
      }

      const selectedIds = new Set(selected.map(activity => activity.id));
      const insertionIndex = Math.min(...selected.map(activity => activities.indexOf(activity)));
      const groupedActivity = createManualGroup(first, orderedSegments);
      activities = activities.filter(activity => !selectedIds.has(activity.id));
      activities.splice(insertionIndex, 0, groupedActivity);
      selectedActivityIds.clear();
      saveActivities();
      rebuildActivityMarks();
      renderActivities();
      setGroupActivitiesMessage(
        `Se agruparon ${selected.length} actividades en un registro de ${formatLength(groupedActivity.appliedLength)} m.`,
        'success'
      );
    }

    function renderActivities() {
      activitiesBody.innerHTML = '';
      if (activities.length <= 5) showAllActivities = false;
      const displayedActivities = showAllActivities ? activities : activities.slice(-5);
      const displayedActivityIds = new Set(displayedActivities.map(activity => activity.id));
      selectedActivityIds.forEach(id => {
        const activity = activities.find(item => item.id === id);
        if (
          !activity ||
          activity.source !== 'manual' ||
          (!showAllActivities && !displayedActivityIds.has(id))
        ) {
          selectedActivityIds.delete(id);
        }
      });
      const has = activities.length > 0;
      activitiesEmpty.style.display = has ? 'none' : 'block';
      activitiesWrapper.style.display = has ? 'block' : 'none';
      activitiesWrapper.classList.toggle('activities-expanded', showAllActivities && activities.length > 5);
      toggleAllActivitiesButton.hidden = activities.length <= 5;
      toggleAllActivitiesButton.textContent = showAllActivities
        ? 'Ver últimas 5'
        : `Ver todas (${activities.length})`;
      toggleAllActivitiesButton.setAttribute('aria-expanded', showAllActivities ? 'true' : 'false');
      displayedActivities.forEach(activity => {
        const row = document.createElement('tr');
        const selectCell = document.createElement('td');
        if (activity.source === 'manual') {
          const select = document.createElement('input');
          select.type = 'checkbox';
          select.className = 'activity-select';
          select.checked = selectedActivityIds.has(activity.id);
          select.setAttribute('aria-label', `Seleccionar actividad ${getNodeDisplayName(activity.startCamera)} a ${getNodeDisplayName(activity.endCamera)}`);
          select.addEventListener('change', () => {
            if (select.checked) selectedActivityIds.add(activity.id);
            else selectedActivityIds.delete(activity.id);
            setGroupActivitiesMessage();
            updateGroupActivitiesButton();
          });
          selectCell.appendChild(select);
        }
        const dir = document.createElement('td');
        dir.className = 'activity-dir';
        dir.textContent = `${getNodeDisplayName(activity.startCamera)} → ${getNodeDisplayName(activity.endCamera)}`;
        const len = document.createElement('td');
        const shownLength = activity.appliedLength ?? activity.length;
        len.textContent = shownLength !== null && shownLength !== undefined && Number.isFinite(Number(shownLength)) ? `${formatLength(shownLength)} m` : '—';
        const dateCell = document.createElement('td');
        const dateInput = document.createElement('input');
        dateInput.type = 'date';
        dateInput.className = 'date-input';
        dateInput.value = activity.date || '';
        dateInput.addEventListener('change', () => { activity.date = dateInput.value; saveActivities(); });
        dateCell.appendChild(dateInput);
        const actions = document.createElement('td');
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'delete-btn';
        del.textContent = '×';
        del.title = 'Eliminar actividad';
        del.addEventListener('click', () => {
          selectedActivityIds.delete(activity.id);
          activities = activities.filter(item => item.id !== activity.id);
          saveActivities();
          rebuildActivityMarks();
          refreshNodeStates();
          renderActivities();
        });
        actions.appendChild(del);
        row.append(selectCell, dir, len, dateCell, actions);
        activitiesBody.appendChild(row);
      });
      updateGroupActivitiesButton();
    }

    function updateFullLengthOption() {
      const useFullLength = activityFullLengthCheckbox.checked;
      activityLengthInput.disabled = useFullLength;
      activityLengthInput.required = !useFullLength;
      if (!useFullLength) {
        activityFullLengthHint.textContent = '';
        return;
      }

      const startCamera = resolveMainCameraName(startCameraInput.value);
      const endCamera = resolveMainCameraName(endCameraInput.value);
      if (!startCamera || !endCamera || startCamera === endCamera) {
        activityLengthInput.value = '';
        activityFullLengthHint.textContent = 'Indica dos cámaras válidas para calcular la longitud completa.';
        return;
      }

      const capacity = getAvailableLength(startCamera, endCamera);
      if (!capacity.ok) {
        activityLengthInput.value = '';
        activityFullLengthHint.textContent = capacity.message;
        return;
      }

      activityLengthInput.value = capacity.availableLength > 0 ? capacity.availableLength.toFixed(2) : '';
      activityFullLengthHint.textContent = capacity.availableLength > 0
        ? `Se registrarán ${formatLength(capacity.availableLength)} m disponibles.`
        : 'Este tramo ya está completamente registrado.';
    }

    function openActivityModal() {
      activityForm.reset();
      activityLengthInput.disabled = false;
      activityLengthInput.required = true;
      activityFullLengthHint.textContent = '';
      activityFormError.textContent = '';
      activityDateInput.value = todayInputDate();
      activityModal.classList.add('open');
      activityModal.setAttribute('aria-hidden','false');
      setTimeout(() => startCameraInput.focus(), 40);
    }
    function closeActivityModal() { activityModal.classList.remove('open'); activityModal.setAttribute('aria-hidden','true'); activityFormError.textContent=''; }

    function registerActivity(event) {
      event.preventDefault();
      const startText = normalizeName(startCameraInput.value);
      const endText = normalizeName(endCameraInput.value);
      const startCamera = resolveMainCameraName(startCameraInput.value);
      const endCamera = resolveMainCameraName(endCameraInput.value);
      const useFullLength = activityFullLengthCheckbox.checked;
      const date = activityDateInput.value;
      if (!startText || !endText) { activityFormError.textContent = 'Debes escribir la cámara de inicio y la cámara de fin.'; return; }
      if (!startCamera || !endCamera) { activityFormError.textContent = `Por ahora las cámaras válidas son: ${validCameras.map(getNodeDisplayName).join(', ')}.`; return; }
      if (startCamera === endCamera) { activityFormError.textContent = 'La cámara de inicio y la cámara de fin no pueden ser la misma.'; return; }
      if (!date) { activityFormError.textContent = 'Debes seleccionar una fecha.'; return; }

      const capacity = getAvailableLength(startCamera, endCamera);

      if (!capacity.ok) {
        activityFormError.textContent = capacity.message;
        return;
      }

      if (capacity.availableLength <= 0) {
        activityFormError.textContent =
          `Solo hay espacio para 0 m entre ${getNodeDisplayName(startCamera)} y ${getNodeDisplayName(endCamera)}. La línea ya está completa.`;
        return;
      }

      const lengthValue = useFullLength ? capacity.availableLength : Number(activityLengthInput.value);
      if (!Number.isFinite(lengthValue) || lengthValue <= 0) {
        activityFormError.textContent = 'La longitud debe ser un número mayor que cero.';
        return;
      }

      if (lengthValue > capacity.availableLength + 1e-9) {
        activityFormError.textContent =
          `Solo hay espacio para ${formatLength(capacity.availableLength)} m entre ${getNodeDisplayName(startCamera)} y ${getNodeDisplayName(endCamera)}.`;
        return;
      }

      const result = computeAppliedSegments(startCamera, endCamera, lengthValue);
      if (!result.ok) { activityFormError.textContent = result.message; return; }
      activities.push({ id: (crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`), source:'registered', segmentOrderVersion:ACTIVITY_SEGMENT_ORDER_VERSION, startCamera, endCamera, length:Number(lengthValue.toFixed(2)), appliedLength:result.appliedLength, appliedSegments:result.appliedSegments, date });
      saveActivities(); rebuildActivityMarks(); renderActivities(); closeActivityModal();
    }

    function saveLineSettings() {
      const settings = {};
      lineDefs.forEach(def => {
        const state = lineStates.get(def.id);
        settings[def.id] = {
          meters: hasKnownLength(def) ? Number(def.meters) : null,
          identifier: state?.attributes?.identifier || '',
          diameter: state?.attributes?.diameter || ''
        };
      });
      try { localStorage.setItem(LINE_SETTINGS_KEY, JSON.stringify(settings)); } catch {}
    }

    function lineHasActivities(lineId) {
      return activities.some(activity =>
        Array.isArray(activity.appliedSegments) &&
        activity.appliedSegments.some(segment => segment.lineId === lineId)
      );
    }

    function buildLine(def) {
      const branch = def.kind === 'branch';
      const connectsDischarge = [def.from, def.to].some(nodeId =>
        nodeMap.get(nodeId)?.elementType === 'discharge'
      );
      const base = E('path', {
        class: `base-line${branch ? ' branch' : ''}`,
        d:def.d,
        'data-line-id': def.id
      });
      baseLinesGroup.appendChild(base);
      const visibleD = branch || connectsDischarge ? def.d : visibleLinePath(def);
      const measure = E('path', { class:'measure-path', d:visibleD, fill:'none', stroke:'none' });
      svg.appendChild(measure);
      const total = measure.getTotalLength();
      const knownLength = hasKnownLength(def);
      const segmentLengths = knownLength ? segmentLengthsForLine(def) : [null];
      const fullOverlay = E('path', { class: `full-overlay${branch ? ' branch' : ''}`, d:visibleD });
      fullLineOverlaysGroup.appendChild(fullOverlay);
      const saved = savedLineSettings[def.id] || {};
      const state = {
        definition:def,
        basePath:base,
        measurePath:measure,
        totalSvgLength:total,
        segmentLengths,
        segmentOverlays:[],
        activitySegmentCount:segmentLengths.map(()=>0),
        shortSegmentSelectors:[],
        fullOverlay,
        hitPath:null,
        guideGroup:null,
        distanceGroup:null,
        distanceGroupBaseTransform:'',
        attributes:{
          identifier: typeof saved.identifier === 'string' ? saved.identifier : (def.identifier || ''),
          diameter: typeof saved.diameter === 'string' ? saved.diameter : ''
        }
      };

      if (knownLength) {
        let acc = 0;
        segmentLengths.forEach((segmentMeters, segmentIndex) => {
          const start = total * (acc / def.meters);
          const end = total * ((acc + segmentMeters) / def.meters);
          const overlay = E('path', {
            class: `segment-overlay${branch ? ' branch' : ''}`,
            d: poly(measure, start, end),
            'data-line-id': def.id,
            'data-segment-index': segmentIndex
          });
          state.segmentOverlays.push(overlay);
          segmentOverlaysGroup.appendChild(overlay);
          state.shortSegmentSelectors[segmentIndex] = addShortSegmentSelector(state, segmentIndex, start, end);
          acc += segmentMeters;
        });
      } else {
        const overlay = E('path', {
          class: `segment-overlay${branch ? ' branch' : ''}`,
          d:visibleD,
          'data-line-id': def.id,
          'data-segment-index': 0
        });
        state.segmentOverlays.push(overlay);
        segmentOverlaysGroup.appendChild(overlay);
      }

      const hit = E('path', { class:'hit', d:visibleD });
      lineHitboxesGroup.appendChild(hit);
      state.hitPath = hit;
      state.guideGroup = addSegmentGuides(measure, def, segmentLengths);
      state.distanceGroup = addDistanceLabel(measure, def);
      state.distanceGroupBaseTransform = state.distanceGroup?.getAttribute('transform') || '';
      lineStates.set(def.id, state);
      let lineTapTimer = null;
      let lastLineTap = 0;
      hit.addEventListener('pointerup', (event) => {
        if (commentPlacementMode) return;
        event.preventDefault();
        if (shouldSuppressTap(event)) return;
        const point = unstretchBranchPoint(def, clientToSvg(event.clientX, event.clientY));
        const index = getSegmentIndexAtLength(state, closestLengthOnPath(measure, point));
        const now = Date.now();
        if (now - lastLineTap <= DOUBLE_TAP_DELAY) {
          if (lineTapTimer) clearTimeout(lineTapTimer);
          lineTapTimer = null;
          lastLineTap = 0;
          openAttributes(def.id);
          return;
        }
        lastLineTap = now;
        lineTapTimer = setTimeout(() => {
          lineTapTimer = null;
          toggleManualSegment(def.id, index);
        }, DOUBLE_TAP_DELAY);
      });
      hit.addEventListener('dblclick', (event) => {
        if (commentPlacementMode) return;
        event.preventDefault();
        event.stopPropagation();
        if (lineTapTimer) clearTimeout(lineTapTimer);
        lineTapTimer = null;
        lastLineTap = 0;
        openAttributes(def.id);
      });
    }

    function getDischargeDirection(node) {
      const collector = lineDefs.find(line =>
        line.elementType === 'collector' && (line.from === node.id || line.to === node.id)
      );
      if (!collector) return { x: 0, y: 1 };
      const otherNodeId = collector.from === node.id ? collector.to : collector.from;
      const otherNode = nodeMap.get(otherNodeId);
      if (!otherNode) return { x: 0, y: 1 };
      const dx = otherNode.x - node.x;
      const dy = otherNode.y - node.y;
      const length = Math.hypot(dx, dy) || 1;
      return { x: dx / length, y: dy / length };
    }

    function getDischargeVisualPoint(node) {
      const direction = getDischargeDirection(node);
      return {
        x: node.x - direction.x * DISCHARGE_HEADWALL_OFFSET,
        y: node.y - direction.y * DISCHARGE_HEADWALL_OFFSET
      };
    }

    function getDischargeRotation(node) {
      const direction = getDischargeDirection(node);
      return Math.atan2(direction.y, direction.x) * 180 / Math.PI - 90;
    }

    function buildNodes() {
      nodeDefs.forEach(n => {
        let shape;
        let nodeContainer;
        if (n.elementType === 'sump') {
          shape = E('rect', {
            class: 'node sump',
            x: n.x - n.radius,
            y: n.y - n.radius,
            width: n.radius * 2,
            height: n.radius * 2,
            rx: 1.2
          });
        } else if (n.elementType === 'discharge') {
          const visualPoint = getDischargeVisualPoint(n);
          nodeContainer = E('g', {
            class: 'headwall-anchor',
            transform: `translate(${visualPoint.x} ${visualPoint.y}) rotate(${getDischargeRotation(n)})`
          });
          shape = E('g', { class: 'node discharge' });
          shape.appendChild(E('circle', { class: 'headwall-hit', cx: 0, cy: -9, r: 8 }));
          shape.appendChild(E('path', {
            class: 'headwall-shape',
            d: 'M -17 -11 L -11 0 L 11 0 L 17 -11 M -2.4 0 L -2.4 9 M 2.4 0 L 2.4 9'
          }));
          nodeContainer.appendChild(shape);
        } else {
          shape = E('circle', { class: 'node camera', cx:n.x, cy:n.y, r:n.radius });
        }
        shape.setAttribute('data-node-id', n.id);
        shape.setAttribute('data-node-type', n.elementType);
        shape.setAttribute('data-active', 'false');
        shape.addEventListener('pointerup', (event) => { if (commentPlacementMode || shouldSuppressTap(event)) return; toggleNode(n.id); });
        shape.addEventListener('dblclick', (event) => {
          if (commentPlacementMode) return;
          event.preventDefault();
          event.stopPropagation();
          openNodeNameEditor(n.id);
        });
        nodesGroup.appendChild(nodeContainer || shape);

        if (n.elementType === 'chamber') {
          const ring = E('circle', {
            class: 'camera-ring',
            cx: n.x,
            cy: n.y,
            r: n.radius - 1.05
          });
          nodesGroup.appendChild(ring);
        }
      });
      placeLabels();
    }

    function placeLabels() {
      labelsGroup.innerHTML = '';
      const placedLabelBounds = [];
      const intersects = (a, b, padding = 0) => !(
        a.right + padding < b.left || a.left - padding > b.right
        || a.bottom + padding < b.top || a.top - padding > b.bottom
      );
      const boundsAt = (x, y, textValue, elementType) => {
        const fontSize = elementType === 'chamber' ? 16 : 11;
        const width = Math.max(fontSize * 1.6, textValue.length * fontSize * 0.62);
        const height = fontSize * 1.25;
        return {
          left: x - width / 2,
          right: x + width / 2,
          top: y - height / 2,
          bottom: y + height / 2
        };
      };
      const scoreLabelPosition = (candidateBounds, nodeId) => {
        let score = 0;
        placedLabelBounds.forEach(bounds => {
          if (intersects(candidateBounds, bounds, 5)) score += 3000;
        });
        nodeDefs.forEach(node => {
          if (node.id === nodeId) return;
          const radius = Math.max(8, Number(node.radius) || 0);
          const nodeBounds = {
            left: node.x - radius,
            right: node.x + radius,
            top: node.y - radius,
            bottom: node.y + radius
          };
          if (intersects(candidateBounds, nodeBounds, 5)) score += 1000;
        });
        lineStates.forEach(state => {
          const path = state.measurePath;
          const total = path.getTotalLength();
          const step = Math.max(1.5, total / 160);
          let overlapsPipe = false;
          for (let length = 0; length <= total; length += step) {
            const point = path.getPointAtLength(length);
            if (
              point.x >= candidateBounds.left - 5 && point.x <= candidateBounds.right + 5
              && point.y >= candidateBounds.top - 5 && point.y <= candidateBounds.bottom + 5
            ) {
              overlapsPipe = true;
              break;
            }
          }
          if (overlapsPipe) score += 10000;
          const distanceText = state.distanceGroup?.querySelector('.distance-text');
          const distanceHit = state.distanceGroup?.querySelector('.distance-hit');
          if (distanceText) {
            const x = Number(distanceText.getAttribute('x'));
            const y = Number(distanceText.getAttribute('y'));
            const angle = Number(
              state.distanceGroup?.getAttribute('transform')?.match(/rotate\(([-+\d.]+)/)?.[1] || 0
            ) * Math.PI / 180;
            const halfWidth = (Number(distanceHit?.getAttribute('width')) || 34) / 2;
            const halfHeight = 10;
            const extentX = Math.abs(Math.cos(angle)) * halfWidth + Math.abs(Math.sin(angle)) * halfHeight;
            const extentY = Math.abs(Math.sin(angle)) * halfWidth + Math.abs(Math.cos(angle)) * halfHeight;
            const distanceBounds = {
              left: x - extentX,
              right: x + extentX,
              top: y - extentY,
              bottom: y + extentY
            };
            if (intersects(candidateBounds, distanceBounds, 4)) score += 4000;
          }
        });
        return score;
      };

      nodeDefs.forEach(n => {
        if (n.showLabel === false) return;
        if (!n.identifierRequired && !n.displayName) return;
        let x = n.x, y = n.y;
        const cls = n.elementType;
        const labelValue = n.displayName || n.id;
        if (n.elementType === 'chamber') {
          const candidates = [
            [42,-26],[44,22],[-42,-26],[-44,22],[0,-36],[0,36],
            [58,-32],[58,32],[-58,-32],[-58,32],[0,-54],[0,54],[72,0],[-72,0]
          ];
          let best = candidates[0], score = 1e9;
          for (const [dx,dy] of candidates) {
            const bx = x + dx, by = y + dy;
            const sc = scoreLabelPosition(boundsAt(bx, by, labelValue, cls), n.id);
            if (sc < score) { score = sc; best = [dx,dy]; }
          }
          x += best[0]; y += best[1];
        } else if (n.elementType === 'discharge') {
          const direction = getDischargeDirection(n);
          const normal = { x: -direction.y, y: direction.x };
          const visualPoint = getDischargeVisualPoint(n);
          const candidates = [
            { x: visualPoint.x - normal.x * 32, y: visualPoint.y - normal.y * 32 },
            { x: visualPoint.x + normal.x * 32, y: visualPoint.y + normal.y * 32 },
            { x: visualPoint.x - direction.x * 20 - normal.x * 25, y: visualPoint.y - direction.y * 20 - normal.y * 25 },
            { x: visualPoint.x - direction.x * 20 + normal.x * 25, y: visualPoint.y - direction.y * 20 + normal.y * 25 }
          ];
          let best = candidates[0];
          let bestScore = Infinity;
          candidates.forEach(candidate => {
            const candidateScore = scoreLabelPosition(
              boundsAt(candidate.x, candidate.y, labelValue, cls),
              n.id
            );
            if (candidateScore < bestScore) {
              best = candidate;
              bestScore = candidateScore;
            }
          });
          x = best.x;
          y = best.y;
        } else {
          const p = nodeMap.get(n.parent) || { x: x - 1, y }; const dx = x - p.x, dy = y - p.y; const len = Math.hypot(dx,dy) || 1;
          x += dx / len * 24; y += dy / len * 16;
        }
        const text = E('text', {
          class:`node-label ${cls}`,
          x,
          y,
          'data-node-id': n.id,
          role: 'button',
          'aria-label': `Editar nombre de ${n.displayName || n.id}`
        });
        text.textContent = labelValue;
        placedLabelBounds.push(boundsAt(x, y, labelValue, cls));

        let labelTapTimer = null;
        let lastLabelTap = 0;
        text.addEventListener('pointerup', event => {
          if (commentPlacementMode) return;
          event.preventDefault();
          event.stopPropagation();
          if (shouldSuppressTap(event)) return;
          const now = Date.now();
          if (now - lastLabelTap <= DOUBLE_TAP_DELAY) {
            if (labelTapTimer) clearTimeout(labelTapTimer);
            labelTapTimer = null;
            lastLabelTap = 0;
            openNodeNameEditor(n.id);
            return;
          }
          lastLabelTap = now;
          labelTapTimer = setTimeout(() => { labelTapTimer = null; }, DOUBLE_TAP_DELAY);
        });
        text.addEventListener('dblclick', event => {
          if (commentPlacementMode) return;
          event.preventDefault();
          event.stopPropagation();
          openNodeNameEditor(n.id);
        });

        labelsGroup.appendChild(text);
      });
      if (lineStates.size) applyBranchStretch();
    }

    function toggleNode(id) {
      const existing = activities.find(a => a.source === 'manualNode' && a.nodeId === id);
      if (existing) activities = activities.filter(a => a.id !== existing.id);
      else activities.push({ id:(crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`), source:'manualNode', nodeId:id, startCamera:id, endCamera:id, length:0, appliedLength:0, appliedSegments:[], date:'' });
      refreshNodeStates(); saveActivities(); renderActivities(); checkVictory();
    }

    function refreshNodeStates() {
      const activeIds = new Set(activities.filter(a => a.source === 'manualNode').map(a => a.nodeId));
      document.querySelectorAll('.node').forEach(node => { const active = activeIds.has(node.dataset.nodeId); node.dataset.active = active ? 'true' : 'false'; node.classList.toggle('active', active); });
    }

    function checkVictory() {
      const allNodesActive = [...document.querySelectorAll('.node')].every(node => node.dataset.active === 'true');
      const allSegmentsActive = [...lineStates.values()].every(state => state.segmentOverlays.every((_,i) => isSegmentActive(state,i)));
      status.textContent = allNodesActive && allSegmentsActive ? '¡Red completada!' : '';
    }

    buildNodes();
    lineDefs.forEach(buildLine);
    layoutBranchDistanceLabels();
    placeLabels();

    const savedFilterSettings = loadFilterSettings();
    labelsFilterCheckbox.checked = savedFilterSettings.showPointNames !== false;
    applyPointNameFilter();
    labelsFilterCheckbox.addEventListener('change', () => {
      applyPointNameFilter();
      saveFilterSettings();
    });

    setupZoomPan();
    resetView();
    window.addEventListener('pageshow', resetView);
    activities = normalizeConstructionOrderActivities(
      normalizeWholeBranchManualActivities(
        loadActivities().map(a => ({ source:'registered', date:'', ...a }))
      )
    );
    saveActivities();
    rebuildActivityMarks();
    refreshNodeStates();
    renderActivities();

    resetButton?.addEventListener('click', () => {
      activities = [];
      selectedActivityIds.clear();
      setGroupActivitiesMessage();
      saveActivities();
      rebuildActivityMarks();
      refreshNodeStates();
      renderActivities();
      checkVictory();
    });

    saveAttrButton.addEventListener('click', () => {
      if (selectedLineId === null) return;
      const state = lineStates.get(selectedLineId);
      const newLength = parseLength(lineLengthInput.value);
      if (!Number.isFinite(newLength) || newLength <= 0) {
        attributeFormError.textContent = 'La longitud debe ser un número mayor que cero.';
        return;
      }

      const lengthChanged = Math.abs(newLength - Number(state.definition.meters)) > 0.000001;
      if (lengthChanged && lineHasActivities(selectedLineId)) {
        attributeFormError.textContent = 'Para cambiar esta longitud, elimina primero las actividades registradas en esta línea.';
        return;
      }

      state.definition.meters = Number(newLength.toFixed(2));
      state.definition.hasDistance = true;
      state.attributes.identifier = lineIdentifierInput.value.trim();
      state.definition.identifier = state.attributes.identifier;
      state.attributes.diameter = diameterInput.value.trim();
      saveLineSettings();

      if (lengthChanged) {
        window.location.reload();
      } else {
        closeAttributes();
      }
    });
    cancelAttrButton.addEventListener('click', closeAttributes);
    saveNodeNameButton.addEventListener('click', saveNodeName);
    cancelNodeNameButton.addEventListener('click', closeNodeNameEditor);
    nodeNameInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        saveNodeName();
      }
    });
    openActivityButton.addEventListener('click', openActivityModal);
    groupActivitiesButton.addEventListener('click', groupSelectedActivities);
    groupActivitiesButton.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      groupSelectedActivities();
    });
    toggleAllActivitiesButton.addEventListener('click', () => {
      showAllActivities = !showAllActivities;
      selectedActivityIds.clear();
      setGroupActivitiesMessage();
      renderActivities();
      activitiesWrapper.scrollTop = 0;
    });
    cancelActivityButton.addEventListener('click', closeActivityModal);
    activityFullLengthCheckbox.addEventListener('change', updateFullLengthOption);
    startCameraInput.addEventListener('input', () => {
      if (activityFullLengthCheckbox.checked) updateFullLengthOption();
    });
    endCameraInput.addEventListener('input', () => {
      if (activityFullLengthCheckbox.checked) updateFullLengthOption();
    });
    activityForm.addEventListener('submit', registerActivity);
    attributeModal.addEventListener('pointerdown', (event) => { if (event.target === attributeModal) closeAttributes(); });
    nodeNameModal.addEventListener('pointerdown', (event) => { if (event.target === nodeNameModal) closeNodeNameEditor(); });
    activityModal.addEventListener('pointerdown', (event) => { if (event.target === activityModal) closeActivityModal(); });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (attributeModal.classList.contains('open')) closeAttributes();
      if (nodeNameModal.classList.contains('open')) closeNodeNameEditor();
      if (activityModal.classList.contains('open')) closeActivityModal();
    });
  </script>

<style>
  .rock-panel { margin-top: 14px; }
  .rock-empty { margin: 0; padding: 16px 10px; color: #6b7280; text-align: center; font-size: 14px; }
  .rock-zones-table th:nth-child(1), .rock-zones-table td:nth-child(1) { width: 78%; }
  .rock-zones-table th:nth-child(2), .rock-zones-table td:nth-child(2) { width: 22%; text-align: center; }
  .rock-zone-chip { display: inline-block; padding: 3px 8px; border-radius: 999px; background: #f3f4f6; color: #4b5563; font-size: 11px; font-weight: 700; }
</style>
<script>
(function() {
  const ROCK_ZONES_KEY = 'redVerde_autocad_rock_zones_v1';

  const quickActions = document.querySelector('.quick-actions');
  const rockButton = document.createElement('button');
  rockButton.id = 'openRockZoneButton';
  rockButton.type = 'button';
  rockButton.className = 'zoom-btn quick-action-btn rock-zone-btn';
  rockButton.textContent = 'Registrar zona de obstrucción';
  quickActions.appendChild(rockButton);

  const filtersStack = document.querySelector('.model-filter-stack');
  const filterLabel = document.createElement('label');
  filterLabel.className = 'filter-row';
  filterLabel.setAttribute('for', 'rockZonesFilterCheckbox');
  filterLabel.innerHTML = '<input id="rockZonesFilterCheckbox" type="checkbox" checked /><span>Zona de obstrucción</span>';
  filtersStack.appendChild(filterLabel);

  const activitiesPanel = document.querySelector('.panel');
  const rockSection = document.createElement('section');
  rockSection.className = 'panel rock-panel';
  rockSection.hidden = true;
  rockSection.setAttribute('aria-live', 'polite');
  rockSection.innerHTML = `
    <h2>Zonas de obstrucción registradas</h2>
    <p id="rockZonesEmpty" class="rock-empty">Todavía no hay zonas de obstrucción.</p>
    <div id="rockZonesWrapper" class="table-wrap" style="display:none;">
      <table class="activities rock-zones-table">
        <thead><tr><th>Tramo</th><th></th></tr></thead>
        <tbody id="rockZonesBody"></tbody>
      </table>
    </div>
  `;
  activitiesPanel.parentNode.appendChild(rockSection);

  const rockModal = document.createElement('div');
  rockModal.id = 'rockZoneModal';
  rockModal.className = 'backdrop';
  rockModal.setAttribute('aria-hidden', 'true');
  rockModal.innerHTML = `
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="rockZoneTitle">
      <h2 id="rockZoneTitle">Registrar zona de obstrucción</h2>
      <p class="modal-subtitle">Marca un tramo completo entre dos cámaras para señalar suelo duro o roca.</p>
      <form id="rockZoneForm" novalidate>
        <div class="form-grid">
          <div class="form-field"><label for="rockStartCameraInput">Cámara de inicio</label><input id="rockStartCameraInput" type="text" placeholder="Ej.: CA1" autocomplete="off" required /></div>
          <div class="form-field"><label for="rockEndCameraInput">Cámara de fin</label><input id="rockEndCameraInput" type="text" placeholder="Ej.: CA2" autocomplete="off" required /></div>
        </div>
        <div id="rockZoneFormError" class="form-error"></div>
        <div class="modal-actions"><button id="cancelRockZoneButton" class="secondary" type="button">Cancelar</button><button type="submit">Guardar zona de obstrucción</button></div>
      </form>
    </section>
  `;
  document.body.appendChild(rockModal);

  const rockZonesFilterCheckbox = document.getElementById('rockZonesFilterCheckbox');
  const rockZonesEmpty = document.getElementById('rockZonesEmpty');
  const rockZonesWrapper = document.getElementById('rockZonesWrapper');
  const rockZonesBody = document.getElementById('rockZonesBody');
  const rockZoneForm = document.getElementById('rockZoneForm');
  const rockStartCameraInput = document.getElementById('rockStartCameraInput');
  const rockEndCameraInput = document.getElementById('rockEndCameraInput');
  const rockZoneFormError = document.getElementById('rockZoneFormError');
  const cancelRockZoneButton = document.getElementById('cancelRockZoneButton');

  let rockZones = loadRockZones();
  const rockZonesGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  rockZonesGroup.setAttribute('id', 'rockZonesGroup');
  const labelsGroupEl = document.getElementById('labelsGroup');
  svg.insertBefore(rockZonesGroup, labelsGroupEl);

  function normalizeNameLocal(v) {
    return String(v ?? '').trim().toUpperCase();
  }

  function loadRockZones() {
    try {
      const saved = localStorage.getItem(ROCK_ZONES_KEY);
      const parsed = saved ? JSON.parse(saved) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }

  function saveRockZones() {
    try {
      localStorage.setItem(ROCK_ZONES_KEY, JSON.stringify(rockZones));
    } catch {}
  }

  function getDirectMainLineBetweenCameras(startCameraId, endCameraId) {
    for (const state of lineStates.values()) {
      const def = state.definition;
      const startIsMain = nodeMap.get(def.from)?.main;
      const endIsMain = nodeMap.get(def.to)?.main;
      if (!startIsMain || !endIsMain) continue;
      if ((def.from === startCameraId && def.to === endCameraId) || (def.from === endCameraId && def.to === startCameraId)) {
        return def.id;
      }
    }
    return null;
  }

  function findRockZoneByLine(lineId) {
    return rockZones.find(zone => zone.lineId === lineId);
  }

  function updateCombinedFilterSettings() {
    try {
      localStorage.setItem(FILTER_SETTINGS_KEY, JSON.stringify({
        showPointNames: labelsFilterCheckbox.checked,
        showRockZones: rockZonesFilterCheckbox.checked
      }));
    } catch {}
  }

  const oldLoadFilterSettings = loadFilterSettings;
  loadFilterSettings = function() {
    const base = oldLoadFilterSettings ? oldLoadFilterSettings() : {};
    return {
      showPointNames: base.showPointNames !== false,
      showRockZones: base.showRockZones !== false
    };
  };

  const oldSaveFilterSettings = saveFilterSettings;
  saveFilterSettings = function() {
    updateCombinedFilterSettings();
  };

  function applyRockZoneFilter() {
    rockZonesGroup.style.display = rockZonesFilterCheckbox.checked ? '' : 'none';
  }

  function linePointAtLength(path, length) {
    return path.getPointAtLength(Math.max(0, Math.min(path.getTotalLength(), length)));
  }

  function buildRockZoneVisual(lineId) {
    const state = lineStates.get(lineId);
    if (!state) return null;
    const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    group.setAttribute('data-line-id', lineId);
    group.style.pointerEvents = 'none';
    const path = state.measurePath;
    const total = path.getTotalLength();
    const spacing = 28;
    const start = 18;
    const end = Math.max(start, total - 18);
    let toggle = 1;
    for (let l = start; l <= end; l += spacing) {
      const p = linePointAtLength(path, l);
      const before = linePointAtLength(path, l - 2);
      const after = linePointAtLength(path, l + 2);
      const dx = after.x - before.x;
      const dy = after.y - before.y;
      const mag = Math.hypot(dx, dy) || 1;
      const nx = (-dy / mag) * 18;
      const ny = (dx / mag) * 18;
      const side = toggle > 0 ? 1 : 0.7;
      const rock = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      rock.setAttribute('cx', (p.x + nx * side).toFixed(2));
      rock.setAttribute('cy', (p.y + ny * side).toFixed(2));
      rock.setAttribute('rx', 8 + (toggle > 0 ? 1.8 : -0.6));
      rock.setAttribute('ry', 5.6 + (toggle > 0 ? 1.2 : -0.3));
      rock.setAttribute('fill', 'none');
      rock.setAttribute('stroke', '#80838a');
      rock.setAttribute('stroke-width', '2.2');
      group.appendChild(rock);
      toggle *= -1;
    }
    return group;
  }

  function renderRockZonesVisuals() {
    rockZonesGroup.innerHTML = '';
    rockZones.forEach(zone => {
      const visual = buildRockZoneVisual(zone.lineId);
      if (visual) rockZonesGroup.appendChild(visual);
    });
    applyRockZoneFilter();
  }

  function renderRockZonesTable() {
    rockZonesBody.innerHTML = '';
    const has = rockZones.length > 0;
    rockZonesEmpty.style.display = has ? 'none' : 'block';
    rockZonesWrapper.style.display = has ? 'block' : 'none';
    rockZones.forEach(zone => {
      const row = document.createElement('tr');
      const tramo = document.createElement('td');
      tramo.innerHTML = `<div class="activity-dir">${getNodeDisplayName(zone.startCamera)} → ${getNodeDisplayName(zone.endCamera)}</div><div class="rock-zone-chip">Zona de obstrucción</div>`;
      const action = document.createElement('td');
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'delete-btn';
      del.textContent = '×';
      del.title = 'Eliminar zona de obstrucción';
      del.addEventListener('click', () => {
        rockZones = rockZones.filter(item => item.id !== zone.id);
        saveRockZones();
        renderRockZonesVisuals();
        renderRockZonesTable();
      });
      action.appendChild(del);
      row.appendChild(tramo);
      row.appendChild(action);
      rockZonesBody.appendChild(row);
    });
  }

  function openRockZoneModal() {
    rockZoneForm.reset();
    rockZoneFormError.textContent = '';
    rockModal.classList.add('open');
    rockModal.setAttribute('aria-hidden', 'false');
    setTimeout(() => rockStartCameraInput.focus(), 40);
  }

  function closeRockZoneModal() {
    rockZoneFormError.textContent = '';
    rockModal.classList.remove('open');
    rockModal.setAttribute('aria-hidden', 'true');
  }

  function saveRockZone(event) {
    event.preventDefault();
    const startCamera = resolveMainCameraName(rockStartCameraInput.value);
    const endCamera = resolveMainCameraName(rockEndCameraInput.value);
    if (!startCamera || !endCamera) {
      rockZoneFormError.textContent = 'Debes escribir dos cámaras válidas.';
      return;
    }
    if (startCamera === endCamera) {
      rockZoneFormError.textContent = 'La cámara de inicio y la cámara de fin no pueden ser la misma.';
      return;
    }
    const lineId = getDirectMainLineBetweenCameras(startCamera, endCamera);
    if (!lineId) {
      rockZoneFormError.textContent = 'Por ahora la zona de obstrucción debe corresponder a un tramo directo entre dos cámaras consecutivas.';
      return;
    }
    const existing = findRockZoneByLine(lineId);
    if (existing) {
      rockZoneFormError.textContent = `Ese tramo ya está registrado como zona de obstrucción.`;
      return;
    }
    rockZones.push({
      id: (crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`),
      lineId,
      startCamera,
      endCamera,
      type: 'rock'
    });
    saveRockZones();
    renderRockZonesVisuals();
    renderRockZonesTable();
    closeRockZoneModal();
  }

  // Keep rock table names updated if the user renames nodes.
  const oldSaveNodeName = saveNodeName;
  saveNodeName = function() {
    oldSaveNodeName();
    renderRockZonesTable();
  };

  // Ensure reset also clears rock zones.
  resetButton?.addEventListener('click', () => {
    rockZones = [];
    saveRockZones();
    renderRockZonesVisuals();
    renderRockZonesTable();
  });

  // Wire events.
  rockButton.addEventListener('click', openRockZoneModal);
  cancelRockZoneButton.addEventListener('click', closeRockZoneModal);
  rockZoneForm.addEventListener('submit', saveRockZone);
  rockModal.addEventListener('pointerdown', (event) => {
    if (event.target === rockModal) closeRockZoneModal();
  });
  rockZonesFilterCheckbox.addEventListener('change', () => {
    applyRockZoneFilter();
    updateCombinedFilterSettings();
  });
  labelsFilterCheckbox.removeEventListener?.('change', saveFilterSettings);
  labelsFilterCheckbox.addEventListener('change', () => {
    applyPointNameFilter();
    updateCombinedFilterSettings();
  });

  // Initialize filter state from storage.
  const filterState = loadFilterSettings();
  rockZonesFilterCheckbox.checked = filterState.showRockZones !== false;
  labelsFilterCheckbox.checked = filterState.showPointNames !== false;
  applyPointNameFilter();
  applyRockZoneFilter();

  renderRockZonesVisuals();
  renderRockZonesTable();

  // Extend Escape handling for the new modal.
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && rockModal.classList.contains('open')) {
      closeRockZoneModal();
    }
  });
})();
</script>

<script>
(function() {
  const COMMENTS_KEY = 'redVerde_autocad_comments_v1';
  const commentButton = document.getElementById('toggleCommentModeButton');

  const filtersStack = document.querySelector('.model-filter-stack');
  const commentFilterLabel = document.createElement('label');
  commentFilterLabel.className = 'filter-row';
  commentFilterLabel.setAttribute('for', 'commentsFilterCheckbox');
  commentFilterLabel.innerHTML = '<input id="commentsFilterCheckbox" type="checkbox" checked /><span>Comentarios</span>';
  filtersStack.appendChild(commentFilterLabel);

  const commentCursor = document.createElement('div');
  commentCursor.className = 'comment-cursor';
  commentCursor.textContent = '💬';
  viewport.appendChild(commentCursor);

  const commentModal = document.createElement('div');
  commentModal.id = 'commentModal';
  commentModal.className = 'backdrop';
  commentModal.setAttribute('aria-hidden', 'true');
  commentModal.innerHTML = `
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="commentModalTitle">
      <h2 id="commentModalTitle">Registrar comentario</h2>
      <p id="commentModalSubtitle" class="modal-subtitle">Escribe la observación correspondiente a este punto del plano.</p>
      <form id="commentForm" novalidate>
        <div class="form-field">
          <label for="commentTextInput">Comentario</label>
          <textarea id="commentTextInput" class="comment-textarea" maxlength="1000" placeholder="Escribe aquí el comentario..." required></textarea>
        </div>
        <div id="commentFormError" class="form-error"></div>
        <div class="modal-actions">
          <button id="deleteCommentButton" class="comment-delete-btn" type="button">Eliminar</button>
          <button id="cancelCommentButton" class="secondary" type="button">Cancelar</button>
          <button type="submit">Guardar comentario</button>
        </div>
      </form>
    </section>
  `;
  document.body.appendChild(commentModal);

  const commentsFilterCheckbox = document.getElementById('commentsFilterCheckbox');
  const commentForm = document.getElementById('commentForm');
  const commentModalTitle = document.getElementById('commentModalTitle');
  const commentModalSubtitle = document.getElementById('commentModalSubtitle');
  const commentTextInput = document.getElementById('commentTextInput');
  const commentFormError = document.getElementById('commentFormError');
  const deleteCommentButton = document.getElementById('deleteCommentButton');
  const cancelCommentButton = document.getElementById('cancelCommentButton');

  const commentsGroup = document.createElementNS(SVG_NS, 'g');
  commentsGroup.setAttribute('id', 'commentsGroup');
  const shortSelectorsLayer = document.getElementById('shortSegmentSelectorsGroup');
  svg.insertBefore(commentsGroup, shortSelectorsLayer);

  let comments = loadComments();
  let selectedCommentId = null;
  let pendingCommentPoint = null;

  function loadComments() {
    try {
      const saved = localStorage.getItem(COMMENTS_KEY);
      const parsed = saved ? JSON.parse(saved) : [];
      if (!Array.isArray(parsed)) return [];
      return parsed.filter(comment =>
        comment &&
        typeof comment.text === 'string' &&
        Number.isFinite(Number(comment.x)) &&
        Number.isFinite(Number(comment.y))
      );
    } catch {
      return [];
    }
  }

  function saveComments() {
    try { localStorage.setItem(COMMENTS_KEY, JSON.stringify(comments)); } catch {}
  }

  function loadCommentsFilterSetting() {
    try {
      const saved = localStorage.getItem(FILTER_SETTINGS_KEY);
      const parsed = saved ? JSON.parse(saved) : {};
      return parsed?.showComments !== false;
    } catch {
      return true;
    }
  }

  function saveAllFilterSettings() {
    try {
      const rockCheckbox = document.getElementById('rockZonesFilterCheckbox');
      localStorage.setItem(FILTER_SETTINGS_KEY, JSON.stringify({
        showPointNames: labelsFilterCheckbox.checked,
        showRockZones: rockCheckbox ? rockCheckbox.checked : true,
        showComments: commentsFilterCheckbox.checked
      }));
    } catch {}
  }

  function applyCommentsFilter() {
    commentsGroup.style.display = commentsFilterCheckbox.checked ? '' : 'none';
  }

  function setCommentMarkerTransform(group) {
    const viewRatio = currentViewBox.width / INITIAL_VIEW_BOX.width;
    const minimumRatio = MIN_VIEW_BOX_WIDTH / INITIAL_VIEW_BOX.width;
    const maximumZoomLog = Math.log(1 / minimumRatio);
    const zoomProgress = maximumZoomLog > 0
      ? Math.max(0, Math.min(1, Math.log(1 / viewRatio) / maximumZoomLog))
      : 0;
    const growthProgress = Math.max(0, Math.min(1, (zoomProgress - 0.6) / 0.4));
    const smoothGrowth = growthProgress * growthProgress * (3 - 2 * growthProgress);
    const progressiveGrowth = 1 + 2 * smoothGrowth;
    const scale = viewRatio * progressiveGrowth;
    group.setAttribute('transform', `translate(${group.dataset.x} ${group.dataset.y}) scale(${scale})`);
    const hit = group.querySelector('.comment-marker-hit');
    if (hit) hit.setAttribute('transform', `scale(${1 / Math.sqrt(progressiveGrowth)})`);
  }

  function updateCommentMarkerScale() {
    commentsGroup.querySelectorAll('.comment-marker').forEach(setCommentMarkerTransform);
  }

  function markerDescription(comment) {
    const compact = comment.text.replace(/\s+/g, ' ').trim();
    return compact.length > 60 ? `${compact.slice(0, 57)}...` : compact;
  }

  function openExistingComment(comment) {
    setCommentPlacementMode(false);
    selectedCommentId = comment.id;
    pendingCommentPoint = null;
    commentModalTitle.textContent = 'Comentario';
    commentModalSubtitle.textContent = 'Puedes leer, editar o eliminar esta observación.';
    commentTextInput.value = comment.text;
    commentFormError.textContent = '';
    deleteCommentButton.style.display = '';
    commentModal.classList.add('open');
    commentModal.setAttribute('aria-hidden', 'false');
    setTimeout(() => commentTextInput.focus(), 40);
  }

  function renderComments() {
    commentsGroup.innerHTML = '';
    comments.forEach(comment => {
      const group = E('g', {
        class: 'comment-marker',
        role: 'button',
        tabindex: '0',
        'aria-label': `Comentario: ${markerDescription(comment)}`
      });
      group.dataset.x = Number(comment.x).toFixed(2);
      group.dataset.y = Number(comment.y).toFixed(2);
      const hit = E('circle', { class:'comment-marker-hit', cx:0, cy:0, r:30 });
      const background = E('circle', { class:'comment-marker-bg', cx:0, cy:0, r:28 });
      const icon = E('text', { class:'comment-marker-icon', x:0, y:1 });
      icon.textContent = '💬';
      const open = event => {
        event.preventDefault();
        event.stopPropagation();
        openExistingComment(comment);
      };
      group.addEventListener('pointerdown', event => {
        event.preventDefault();
        event.stopPropagation();
      });
      group.addEventListener('pointerup', open);
      group.addEventListener('keydown', event => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        open(event);
      });
      group.append(hit, background, icon);
      commentsGroup.appendChild(group);
      setCommentMarkerTransform(group);
    });
    applyCommentsFilter();
  }

  function setCommentPlacementMode(active) {
    commentPlacementMode = Boolean(active);
    commentButton.classList.toggle('active', commentPlacementMode);
    commentButton.setAttribute('aria-pressed', commentPlacementMode ? 'true' : 'false');
    commentButton.textContent = commentPlacementMode ? 'Cancelar' : 'Comentario';
    viewport.classList.toggle('comment-placement-mode', commentPlacementMode);
    if (!commentPlacementMode) commentCursor.style.display = 'none';
    if (commentPlacementMode) {
      commentsFilterCheckbox.checked = true;
      applyCommentsFilter();
      saveAllFilterSettings();
    }
  }

  function openNewComment(point) {
    setCommentPlacementMode(false);
    selectedCommentId = null;
    pendingCommentPoint = {
      x: Number(point.x.toFixed(2)),
      y: Number(point.y.toFixed(2))
    };
    commentModalTitle.textContent = 'Registrar comentario';
    commentModalSubtitle.textContent = 'Escribe la observación correspondiente a este punto del plano.';
    commentTextInput.value = '';
    commentFormError.textContent = '';
    deleteCommentButton.style.display = 'none';
    commentModal.classList.add('open');
    commentModal.setAttribute('aria-hidden', 'false');
    setTimeout(() => commentTextInput.focus(), 40);
  }

  function closeCommentModal() {
    selectedCommentId = null;
    pendingCommentPoint = null;
    commentFormError.textContent = '';
    commentModal.classList.remove('open');
    commentModal.setAttribute('aria-hidden', 'true');
  }

  function saveComment(event) {
    event.preventDefault();
    const text = commentTextInput.value.trim();
    if (!text) {
      commentFormError.textContent = 'El comentario no puede quedar vacío.';
      return;
    }

    if (selectedCommentId) {
      const comment = comments.find(item => item.id === selectedCommentId);
      if (comment) comment.text = text;
    } else if (pendingCommentPoint) {
      comments.push({
        id: (crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`),
        x: pendingCommentPoint.x,
        y: pendingCommentPoint.y,
        text
      });
    }
    saveComments();
    renderComments();
    closeCommentModal();
  }

  function deleteSelectedComment() {
    if (!selectedCommentId) return;
    comments = comments.filter(comment => comment.id !== selectedCommentId);
    saveComments();
    renderComments();
    closeCommentModal();
  }

  const previousApplyViewBox = applyViewBox;
  applyViewBox = function() {
    previousApplyViewBox();
    updateCommentMarkerScale();
  };

  commentButton.addEventListener('click', () => setCommentPlacementMode(!commentPlacementMode));
  viewport.addEventListener('pointermove', event => {
    if (!commentPlacementMode || event.pointerType === 'touch' || event.target.closest('.comment-marker, .model-filter-ui')) {
      commentCursor.style.display = 'none';
      return;
    }
    const rect = viewport.getBoundingClientRect();
    commentCursor.style.left = `${event.clientX - rect.left}px`;
    commentCursor.style.top = `${event.clientY - rect.top}px`;
    commentCursor.style.display = 'block';
  });
  viewport.addEventListener('pointerleave', () => { commentCursor.style.display = 'none'; });

  svg.addEventListener('pointerup', event => {
    if (!commentPlacementMode || event.button !== 0 || event.isPrimary === false) return;
    if (Date.now() < suppressTapUntil || multiTouchGesture) return;
    if (event.target.closest('.comment-marker, .model-filter-ui')) return;
    event.preventDefault();
    event.stopPropagation();
    openNewComment(clientToSvg(event.clientX, event.clientY));
  });

  commentForm.addEventListener('submit', saveComment);
  cancelCommentButton.addEventListener('click', closeCommentModal);
  deleteCommentButton.addEventListener('click', deleteSelectedComment);
  commentModal.addEventListener('pointerdown', event => {
    if (event.target === commentModal) closeCommentModal();
  });

  commentsFilterCheckbox.checked = loadCommentsFilterSetting();
  commentsFilterCheckbox.addEventListener('change', () => {
    applyCommentsFilter();
    saveAllFilterSettings();
  });
  labelsFilterCheckbox.addEventListener('change', saveAllFilterSettings);
  document.getElementById('rockZonesFilterCheckbox')?.addEventListener('change', saveAllFilterSettings);

  resetButton?.addEventListener('click', () => {
    comments = [];
    saveComments();
    renderComments();
    setCommentPlacementMode(false);
  });

  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    if (commentModal.classList.contains('open')) closeCommentModal();
    else if (commentPlacementMode) setCommentPlacementMode(false);
  });

renderComments();
  updateCommentMarkerScale();
})();
</script>

    .model-filter-overlay .satellite-opacity-control output { white-space: nowrap; }
    .model-filter-overlay .satellite-opacity-control input { height: 14px; }
    .model-filter-overlay .satellite-attribution {
      margin: 1px 0 0 18px; font-size: 7.5px; line-height: 1.15;
    }
  }
</style>
<script>
(function() {
  // Este lindero pertenece al modelo incorporado Costanera_acacias_AALL.
  if (!nodeMap.has('CAM_AL_24')) return;

  const LINDERO_LAYER_SETTINGS_KEY = 'redVerde_costanera_lindero_layers_v2';
  // Vertices reconstruidos en el mismo marco CAD de la red a partir del PDF
  // conjunto. Las coordenadas UTM se conservan como fuente geodesica.
  const linderoPoints = [
    { id: 'P1',  x: 19.44,   y: 2836.38, east: 603378.2373, north: 9754624.4459 },
    { id: 'P2',  x: 1315.48, y: 2803.29, east: 603559.6095, north: 9754758.1392 },
    { id: 'P3',  x: 1267.47, y: 2564.63, east: 603529.0173, north: 9754787.3646 },
    { id: 'P4',  x: 1145.70, y: 2327.59, east: 603488.0770, north: 9754809.0183 },
    { id: 'P5',  x: 1093.18, y: 268.28,  east: 603275.6593, north: 9755097.1885 },
    { id: 'P6',  x: 378.43,  y: 286.65,  east: 603175.6451, north: 9755023.4408 },
    { id: 'P7',  x: 378.41,  y: 558.69,  east: 603202.7147, north: 9754984.6807 },
    { id: 'P8',  x: 277.46,  y: 1250.30, east: 603257.1588, north: 9754876.0988 },
    { id: 'P9',  x: 384.03,  y: 1246.26, east: 603271.9415, north: 9754887.2798 },
    { id: 'P10', x: 399.84,  y: 1866.57, east: 603335.9254, north: 9754800.4752 },
    { id: 'P11', x: 162.88,  y: 1872.62, east: 603302.7649, north: 9754776.0317 }
  ].map(point => ({
    ...point,
    ...transformCostaneraCadPoint(point)
  }));
  const polygonPoints = linderoPoints.map(point => `${point.x},${point.y}`).join(' ');
  const drawingUnitsPerMeter = 5.7530408;
  const satelliteMargin = 20 * drawingUnitsPerMeter;
  const satelliteExtentPoints = [
    ...linderoPoints,
    ...nodeDefs
      .filter(node => Number.isFinite(Number(node.x)) && Number.isFinite(Number(node.y)))
      .map(node => ({ x: Number(node.x), y: Number(node.y) }))
  ];
  const satelliteBounds = {
    x: Math.min(...satelliteExtentPoints.map(point => point.x)) - satelliteMargin,
    y: Math.min(...satelliteExtentPoints.map(point => point.y)) - satelliteMargin,
    width: Math.max(...satelliteExtentPoints.map(point => point.x))
      - Math.min(...satelliteExtentPoints.map(point => point.x))
      + satelliteMargin * 2,
    height: Math.max(...satelliteExtentPoints.map(point => point.y))
      - Math.min(...satelliteExtentPoints.map(point => point.y))
      + satelliteMargin * 2
  };

  const svgElement = document.getElementById('networkSvg');
  const baseLayer = document.getElementById('baseLinesGroup');
  const frontLayer = document.getElementById('shortSegmentSelectorsGroup');

  const defs = E('defs');
  const clipPath = E('clipPath', { id: 'linderoSatelliteClip', clipPathUnits: 'userSpaceOnUse' });
  clipPath.appendChild(E('rect', {
    x: satelliteBounds.x.toFixed(2),
    y: satelliteBounds.y.toFixed(2),
    width: satelliteBounds.width.toFixed(2),
    height: satelliteBounds.height.toFixed(2)
  }));
  defs.appendChild(clipPath);
  svgElement.insertBefore(defs, svgElement.firstChild);

  const satelliteLayer = E('g', {
    id: 'satelliteLayerGroup',
    'clip-path': 'url(#linderoSatelliteClip)',
    opacity: '0.5',
    'aria-label': 'Imagen satelital dentro del rectángulo de cobertura'
  });
  const satelliteTransform = {
    a: 1.71601668,
    b: 0.00107929487,
    c: -0.00106980427,
    d: 1.70454525,
    e: -218.055406,
    f: -99.5703121
  };
  const satelliteTransformDeterminant = satelliteTransform.a * satelliteTransform.d
    - satelliteTransform.b * satelliteTransform.c;
  // Los mosaicos Web Mercator y el SVG usan X hacia la derecha e Y hacia
  // abajo. Por eso una rotacion/escala valida debe tener determinante positivo.
  // Un valor negativo significa que el mapa quedo reflejado.
  if (satelliteTransformDeterminant <= 0) {
    throw new Error('Georreferenciacion rechazada: la transformacion satelital refleja el mapa.');
  }
  const satelliteTiles = E('g', {
    transform: `matrix(${satelliteTransform.a} ${satelliteTransform.b} ${satelliteTransform.c} ${satelliteTransform.d} ${satelliteTransform.e} ${satelliteTransform.f})`
  });
  const tileZoom = 19;
  const tileOriginX = 145530;
  const tileOriginY = 265371;
  // Carga todos los mosaicos que intersectan el rectangulo calculado con los
  // extremos de red/lindero y su margen de 20 m; no depende de un rango fijo.
  const satelliteBoundsCorners = [
    { x: satelliteBounds.x, y: satelliteBounds.y },
    { x: satelliteBounds.x + satelliteBounds.width, y: satelliteBounds.y },
    { x: satelliteBounds.x, y: satelliteBounds.y + satelliteBounds.height },
    { x: satelliteBounds.x + satelliteBounds.width, y: satelliteBounds.y + satelliteBounds.height }
  ];
  const inverseSatellitePoint = point => {
    const translatedX = point.x - satelliteTransform.e;
    const translatedY = point.y - satelliteTransform.f;
    return {
      x: (satelliteTransform.d * translatedX - satelliteTransform.c * translatedY)
        / satelliteTransformDeterminant,
      y: (-satelliteTransform.b * translatedX + satelliteTransform.a * translatedY)
        / satelliteTransformDeterminant
    };
  };
  const satelliteLocalCorners = satelliteBoundsCorners.map(inverseSatellitePoint);
  const minSatelliteLocalX = Math.min(...satelliteLocalCorners.map(point => point.x));
  const maxSatelliteLocalX = Math.max(...satelliteLocalCorners.map(point => point.x));
  const minSatelliteLocalY = Math.min(...satelliteLocalCorners.map(point => point.y));
  const maxSatelliteLocalY = Math.max(...satelliteLocalCorners.map(point => point.y));
  const firstTileX = tileOriginX + Math.floor(minSatelliteLocalX / 256);
  const lastTileX = tileOriginX + Math.floor(maxSatelliteLocalX / 256);
  const firstTileY = tileOriginY + Math.floor(minSatelliteLocalY / 256);
  const lastTileY = tileOriginY + Math.floor(maxSatelliteLocalY / 256);

  for (let tileY = firstTileY; tileY <= lastTileY; tileY += 1) {
    for (let tileX = firstTileX; tileX <= lastTileX; tileX += 1) {
      const tileUrl = `https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${tileZoom}/${tileY}/${tileX}`;
      const image = E('image', {
        x: (tileX - tileOriginX) * 256,
        y: (tileY - tileOriginY) * 256,
        width: 256,
        height: 256,
        preserveAspectRatio: 'none',
        href: tileUrl
      });
      image.setAttributeNS(
        'http://www.w3.org/1999/xlink',
        'href',
        tileUrl
      );
      satelliteTiles.appendChild(image);
    }
  }
  satelliteLayer.appendChild(satelliteTiles);
  svgElement.insertBefore(satelliteLayer, baseLayer);

  const linderoGroup = E('g', { id: 'linderoGroup', 'aria-label': 'Lindero georreferenciado' });
  const outline = E('polygon', { class: 'lindero-outline', points: polygonPoints });
  const outlineTitle = E('title');
  outlineTitle.textContent = 'Lindero georreferenciado - WGS84 / UTM 17S';
  outline.appendChild(outlineTitle);
  linderoGroup.appendChild(outline);

  linderoPoints.forEach(point => {
    const marker = E('g', { transform: `translate(${point.x} ${point.y})` });
    const markerTitle = E('title');
    markerTitle.textContent = `${point.id} - Este ${point.east.toFixed(4)} m, Norte ${point.north.toFixed(4)} m`;
    const circle = E('circle', { class: 'lindero-vertex', r: 13 });
    const label = E('text', { class: 'lindero-label', x: 0, y: 1 });
    label.textContent = point.id.replace('P', '');
    marker.append(markerTitle, circle, label);
    linderoGroup.appendChild(marker);
  });
  svgElement.insertBefore(linderoGroup, frontLayer);

  const filtersStack = document.querySelector('.model-filter-stack');
  const linderoFilterLabel = document.createElement('label');
  linderoFilterLabel.className = 'filter-row';
  linderoFilterLabel.setAttribute('for', 'linderoFilterCheckbox');
  linderoFilterLabel.innerHTML = '<input id="linderoFilterCheckbox" type="checkbox" /><span>Linderos / Perímetro</span>';

  const satelliteFilterLabel = document.createElement('label');
  satelliteFilterLabel.className = 'filter-row';
  satelliteFilterLabel.setAttribute('for', 'satelliteFilterCheckbox');
  satelliteFilterLabel.innerHTML = '<input id="satelliteFilterCheckbox" type="checkbox" checked /><span>Imagen satelital</span>';

  const opacityControl = document.createElement('label');
  opacityControl.className = 'satellite-opacity-control';
  opacityControl.setAttribute('for', 'satelliteOpacityRange');
  opacityControl.innerHTML = '<span>Transparencia</span><output id="satelliteOpacityValue">50 %</output><input id="satelliteOpacityRange" type="range" min="0" max="100" step="5" value="50" />';

  const attribution = document.createElement('p');
  attribution.className = 'satellite-attribution';
  attribution.innerHTML = 'Imagen: <a href="https://www.arcgis.com/home/item.html?id=10df2279f9684e4a9f6a7f08febac2a9" target="_blank" rel="noopener noreferrer">Esri World Imagery</a> y sus proveedores.';

  filtersStack.append(linderoFilterLabel, satelliteFilterLabel, opacityControl, attribution);

  const linderoCheckbox = document.getElementById('linderoFilterCheckbox');
  const satelliteCheckbox = document.getElementById('satelliteFilterCheckbox');
  const opacityRange = document.getElementById('satelliteOpacityRange');
  const opacityValue = document.getElementById('satelliteOpacityValue');

  function loadLayerSettings() {
    try {
      const parsed = JSON.parse(localStorage.getItem(LINDERO_LAYER_SETTINGS_KEY) || '{}');
      return parsed && typeof parsed === 'object' ? parsed : {};
    } catch {
      return {};
    }
  }

  function saveLayerSettings() {
    try {
      localStorage.setItem(LINDERO_LAYER_SETTINGS_KEY, JSON.stringify({
        showLindero: linderoCheckbox.checked,
        showSatellite: satelliteCheckbox.checked,
        satelliteOpacity: Number(opacityRange.value) / 100
      }));
    } catch {}
  }

  function applyLayerSettings() {
    linderoGroup.style.display = linderoCheckbox.checked ? '' : 'none';
    satelliteLayer.style.display = satelliteCheckbox.checked ? '' : 'none';
    satelliteLayer.setAttribute('opacity', (Number(opacityRange.value) / 100).toFixed(2));
    opacityValue.textContent = `${opacityRange.value} %`;
    opacityControl.style.opacity = satelliteCheckbox.checked ? '1' : '.45';
    opacityRange.disabled = !satelliteCheckbox.checked;
  }

  const savedSettings = loadLayerSettings();
  linderoCheckbox.checked = savedSettings.showLindero === true;
  satelliteCheckbox.checked = savedSettings.showSatellite !== false;
  opacityRange.value = Number.isFinite(Number(savedSettings.satelliteOpacity))
    ? String(Math.round(Math.max(0, Math.min(1, Number(savedSettings.satelliteOpacity))) * 100))
    : '50';
  applyLayerSettings();

  linderoCheckbox.addEventListener('change', () => {
    applyLayerSettings();
    saveLayerSettings();
  });
  satelliteCheckbox.addEventListener('change', () => {
    applyLayerSettings();
    saveLayerSettings();
  });
  opacityRange.addEventListener('input', applyLayerSettings);
  opacityRange.addEventListener('change', saveLayerSettings);

  // Incluye red, lindero, satelite y paneles al usar el boton Centrar.
  const originalRight = INITIAL_VIEW_BOX.x + INITIAL_VIEW_BOX.width;
  const originalBottom = INITIAL_VIEW_BOX.y + INITIAL_VIEW_BOX.height;
  const expandedLeft = Math.min(INITIAL_VIEW_BOX.x, satelliteBounds.x);
  const expandedTop = Math.min(INITIAL_VIEW_BOX.y, satelliteBounds.y);
  const expandedRight = Math.max(originalRight, satelliteBounds.x + satelliteBounds.width);
  const expandedBottom = Math.max(originalBottom, satelliteBounds.y + satelliteBounds.height);
  INITIAL_VIEW_BOX.x = expandedLeft;
  INITIAL_VIEW_BOX.y = expandedTop;
  INITIAL_VIEW_BOX.width = expandedRight - expandedLeft;
  INITIAL_VIEW_BOX.height = expandedBottom - expandedTop;
  currentViewBox = { ...INITIAL_VIEW_BOX };
  applyViewBox();
})();
</script>
