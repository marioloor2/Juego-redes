<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>Visualización de red</title>
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./version-manager.css" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #fafafa; }
    body {
      margin: 0; width: 100%; height: 100%; min-height: 100dvh; overflow: hidden;
      font-family: Arial, sans-serif; background: #fafafa;
      display: flex; justify-content: center; align-items: stretch; padding: 0;
      touch-action: manipulation; overscroll-behavior: none;
    }
    .app {
      width: 100%; height: 100dvh; min-height: 0; overflow: hidden; background: #fff;
    }
    .layout, .network-col, .network-shell { width: 100%; height: 100%; min-height: 0; }
    .layout { display: block; }
    .network-col { min-width: 0; }
    .network-shell { overflow: hidden; background: #fafafa; }
    .model-header {
      position: absolute; z-index: 6; top: max(8px, env(safe-area-inset-top)); right: 8px; left: 8px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      pointer-events: none;
    }
    .model-title {
      margin: 0; padding: 7px 10px; border: 1px solid rgba(209,213,219,.9); border-radius: 10px;
      background: rgba(255,255,255,.94); box-shadow: 0 3px 12px rgba(0,0,0,.1);
      font-size: clamp(16px, 4.5vw, 22px); line-height: 1.1; white-space: nowrap;
    }
    .toolbar {
      display: flex; justify-content: flex-end; gap: 5px; padding: 5px;
      border: 1px solid rgba(209,213,219,.9); border-radius: 11px;
      background: rgba(255,255,255,.94); box-shadow: 0 3px 12px rgba(0,0,0,.1);
      pointer-events: auto;
    }
    .zoom-btn { min-width: 34px; min-height: 34px; padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; color: #111; font-size: 18px; line-height: 1; cursor: pointer; }
    .fit-btn { min-width: 62px; font-size: 12px; }
    .viewport { position: relative; overflow: hidden; width: 100%; height: 100%; background: #fafafa; touch-action: none; cursor: grab; }
    .viewport.panning { cursor: grabbing; }
    svg { display: block; width: 100%; height: 100%; min-height: 0; background: #fafafa; user-select: none; touch-action: none; }
    .base-line, .segment-overlay, .full-overlay, .hit { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .base-line { stroke: #111; stroke-width: 5.2; pointer-events: none; }
    .base-line.branch { stroke-width: 3.4; }
    .segment-overlay { stroke: #16a34a; stroke-width: 6; pointer-events: none; opacity: 0; transition: opacity .12s ease; }
    .segment-overlay.branch { stroke-width: 4.2; }
    .segment-overlay.active { opacity: 1; }
    .full-overlay { stroke: #16a34a; stroke-width: 6.2; pointer-events: none; opacity: 0; }
    .full-overlay.branch { stroke-width: 4.4; }
    .full-overlay.active { opacity: 1; }
    .hit { stroke: transparent; stroke-width: 24; cursor: pointer; }
    .camera-ring { fill: none; stroke: #dc2626; stroke-width: 2.1; pointer-events: none; }
    .node { fill: #111; stroke: #fff; stroke-width: 2.5; cursor: pointer; transition: fill .12s ease, transform .12s ease; transform-box: fill-box; transform-origin: center; }
    .node.main { stroke: #111; stroke-width: 0; }
    .node:active { transform: scale(1.1); }
    .node.active { fill: #16a34a; }
    .node-label { fill: #111; font-weight: 700; text-anchor: middle; dominant-baseline: middle; pointer-events: all; cursor: pointer; user-select: none; paint-order: stroke; stroke: #fafafa; stroke-width: 6px; stroke-linejoin: round; }
    .node-label.main { font-size: 16px; }
    .node-label.terminal { font-size: 11px; font-weight: 600; fill: #1f2937; stroke-width: 4px; }
    .distance-group { cursor: pointer; }
    .distance-hit { fill: transparent; pointer-events: all; }
    .distance-text { font-weight: 700; fill: #6b7280; text-anchor: middle; dominant-baseline: middle; pointer-events: none; paint-order: stroke; stroke: #fafafa; stroke-width: 3.5px; stroke-linejoin: round; opacity: .85; }
    .distance-text.collector { font-size: 11px; }
    .distance-text.branch { font-size: 9px; opacity: .62; }
    .segment-guides { opacity: 0; pointer-events: none; transition: opacity .15s ease; }
    .segment-guides.visible { opacity: 1; }
    .segment-guide { stroke: #9ca3af; stroke-width: 1.6; }
    .short-segment-selectors { opacity: 0; pointer-events: none; transition: opacity .15s ease; }
    .short-segment-selectors.visible { opacity: 1; pointer-events: auto; }
    .short-segment-selector { cursor: pointer; outline: none; }
    .short-segment-hit { fill: transparent; pointer-events: all; }
    .short-segment-leader { stroke: #6b7280; stroke-width: 1.4; pointer-events: none; }
    .short-segment-pill { fill: #fff; stroke: #6b7280; stroke-width: 1.4; pointer-events: none; }
    .short-segment-text { fill: #374151; font-size: 9.5px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
    .short-segment-selector.active .short-segment-leader, .short-segment-selector.active .short-segment-pill { stroke: #16a34a; }
    .short-segment-selector.active .short-segment-pill { fill: #dcfce7; }
    .short-segment-selector.active .short-segment-text { fill: #166534; }
    #status {
      position: absolute; z-index: 6; right: 12px; bottom: max(10px, env(safe-area-inset-bottom)); left: 12px;
      min-height: 0; color: #16a34a; font-weight: 700; text-align: center; pointer-events: none;
    }
    .filter-panel { padding: 12px; border: 1px solid #d1d5db; border-radius: 12px; background: rgba(255,255,255,.96); }
    .filter-panel h2 { margin: 0 0 10px; font-size: 17px; }
    .filter-row { display: flex; align-items: center; gap: 9px; color: #1f2937; font-size: 14px; font-weight: 700; cursor: pointer; }
    .filter-row input { width: 18px; height: 18px; margin: 0; accent-color: #16a34a; cursor: pointer; }
    .model-filter-object { overflow: visible; }
    .model-filter-ui { width: 100%; height: 100%; font-family: Arial, sans-serif; pointer-events: auto; }
    .model-activity-object { overflow: visible; }
    .model-activity-ui {
      width: 100%; height: 100%; padding-right: 3px; overflow-y: auto;
      font-family: Arial, sans-serif; pointer-events: auto; text-align: left;
      scrollbar-width: thin;
    }
    .model-activity-ui .actions { display: grid; gap: 8px; margin: 0 0 10px; }
    .model-activity-ui .actions button { width: 100%; padding: 10px 9px; font-size: 13px; }
    .model-activity-ui .panel {
      padding: 12px; border: 1px solid #d1d5db; border-radius: 12px;
      background: rgba(255,255,255,.96); box-shadow: 0 5px 16px rgba(0,0,0,.12);
    }
    .model-activity-ui .rock-panel { margin-top: 10px; }
    .model-activity-ui .activities-heading { align-items: flex-start; gap: 6px; }
    .model-activity-ui .activities-heading h2 { font-size: 15px; }
    .model-activity-ui .group-activities-btn { padding: 7px 8px; font-size: 11px; }
    .model-activity-ui .activities th,
    .model-activity-ui .activities td { padding: 6px 3px; font-size: 10px; }
    .model-activity-ui .activities th { font-size: 9px; }
    .model-activity-ui .date-input { padding: 5px 2px; font-size: 9px; }
    .model-activity-ui .delete-btn { width: 23px; height: 23px; font-size: 15px; }
    .model-filter-panel { margin: 0; width: 100%; box-shadow: 0 5px 16px rgba(0,0,0,.12); }
    .model-filter-stack { display: grid; gap: 8px; }
    .progress-panel { margin-top: 8px; box-shadow: 0 5px 16px rgba(0,0,0,.12); }
    .progress-list { display: grid; gap: 8px; }
    .progress-row { display: grid; grid-template-columns: auto 1fr; gap: 6px; align-items: baseline; color: #1f2937; font-size: 12px; }
    .progress-label, .progress-value { font-weight: 700; }
    .progress-value { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .progress-warning { margin: 8px 0 0; color: #92400e; font-size: 10.5px; line-height: 1.35; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .actions button { flex: 1 1 130px; }
    button { border: 0; border-radius: 12px; padding: 12px 18px; background: #111; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .activity-btn { background: #16a34a; }
    .panel h2 { margin: 0 0 10px; font-size: 18px; }
    .activities-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .activities-heading h2 { margin: 0; }
    .group-activities-btn { flex: 0 0 auto; padding: 8px 12px; border-radius: 9px; background: #2563eb; font-size: 13px; }
    .group-activities-message { min-height: 18px; margin: 0 0 7px; color: #4b5563; font-size: 12px; line-height: 1.35; }
    .group-activities-message.error { color: #b91c1c; font-weight: 700; }
    .group-activities-message.success { color: #15803d; font-weight: 700; }
    .activities-empty { margin: 0; padding: 16px 10px; color: #6b7280; text-align: center; font-size: 14px; }
    .table-wrap { overflow-x: auto; border: 1px solid #d1d5db; border-radius: 12px; background: #fff; }
    .activities { width: 100%; min-width: 0; table-layout: fixed; border-collapse: collapse; background: #fff; }
    .activities th, .activities td { padding: 8px 6px; border-bottom: 1px solid #e5e7eb; text-align: left; font-size: 13px; vertical-align: middle; }
    .activities th { background: #f3f4f6; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
    .activities th:nth-child(1), .activities td:nth-child(1) { width: 9%; text-align: center; }
    .activities th:nth-child(2), .activities td:nth-child(2) { width: 25%; }
    .activities th:nth-child(3), .activities td:nth-child(3) { width: 18%; }
    .activities th:nth-child(4), .activities td:nth-child(4) { width: 38%; }
    .activities th:nth-child(5), .activities td:nth-child(5) { width: 10%; text-align: center; }
    .activities tbody tr:last-child td { border-bottom: 0; }
    .activity-select { width: 18px; height: 18px; margin: 0; accent-color: #2563eb; cursor: pointer; }
    .date-input { width: 100%; min-width: 0; padding: 6px 4px; border: 1px solid #bfc5ce; border-radius: 7px; font-size: 12px; background: #fff; }
    .activity-dir { overflow-wrap: anywhere; font-weight: 700; }
    .delete-btn { width: 28px; height: 28px; padding: 0; border-radius: 50%; background: #fee2e2; color: #dc2626; font-size: 18px; font-weight: 800; line-height: 1; }
    .backdrop { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(0,0,0,.45); }
    .backdrop.open { display: flex; }
    .modal { width: min(100%, 430px); max-height: calc(100vh - 36px); overflow-y: auto; padding: 20px; background: #fff; border-radius: 18px; text-align: left; box-shadow: 0 18px 60px rgba(0,0,0,.28); }
    .modal h2 { margin: 0 0 6px; font-size: 22px; }
    .modal-subtitle { margin: 0 0 16px; color: #666; font-size: 14px; }
    .attr-table { width: 100%; margin-bottom: 18px; border-collapse: collapse; }
    .attr-table th, .attr-table td { padding: 11px; border: 1px solid #d1d5db; vertical-align: middle; }
    .attr-table th { width: 38%; background: #f3f4f6; font-size: 14px; }
    .attr-table input, .form-field input { width: 100%; padding: 10px; border: 1px solid #bfc5ce; border-radius: 9px; font-size: 16px; }
    .form-grid { display: grid; gap: 14px; margin-bottom: 18px; }
    .form-field { display: grid; gap: 6px; }
    .form-field label { color: #374151; font-size: 14px; font-weight: 700; }
    .full-length-option { display: flex !important; align-items: center; gap: 9px; margin-top: 3px; cursor: pointer; }
    .form-field .full-length-checkbox { width: 18px; height: 18px; margin: 0; padding: 0; accent-color: #16a34a; cursor: pointer; }
    .activity-length-hint { min-height: 17px; color: #4b5563; font-size: 12px; line-height: 1.35; }
    .form-field input:disabled { background: #f3f4f6; color: #374151; opacity: 1; }
    .form-error { min-height: 20px; margin: -4px 0 12px; color: #b91c1c; font-size: 14px; font-weight: 700; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .secondary { background: #e5e7eb; color: #111; }
    @media (max-width: 420px) {
      .model-header { top: max(5px, env(safe-area-inset-top)); right: 5px; left: 5px; gap: 5px; }
      .model-title { padding: 7px 8px; font-size: 16px; }
      .toolbar { gap: 3px; padding: 4px; }
      .zoom-btn { min-width: 32px; min-height: 32px; padding: 4px 6px; }
      .fit-btn { min-width: 57px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="layout">
      <section class="network-col">
        <div class="network-shell">
          <div id="networkViewport" class="viewport">
            <div class="model-header">
              <h1 class="model-title">Visualización de red</h1>
              <div class="toolbar" aria-label="Controles del diagrama">
                <button id="zoomOutButton" class="zoom-btn" type="button" aria-label="Alejar">−</button>
                <button id="fitViewButton" class="zoom-btn fit-btn" type="button">Centrar</button>
                <button id="zoomInButton" class="zoom-btn" type="button" aria-label="Acercar">+</button>
              </div>
            </div>
            <svg id="networkSvg" viewBox="-175 34.53 1157.19 1370.95" preserveAspectRatio="xMidYMid meet" aria-label="Red esquemática desde AutoCAD">
              <g id="baseLinesGroup"></g>
              <g id="segmentGuidesGroup"></g>
              <g id="segmentOverlaysGroup"></g>
              <g id="fullLineOverlaysGroup"></g>
              <g id="lineHitboxesGroup"></g>
              <g id="distanceLabelsGroup"></g>
              <g id="nodesGroup"></g>
              <g id="labelsGroup"></g>
              <g id="shortSegmentSelectorsGroup" class="short-segment-selectors"></g>

              <foreignObject
                id="modelFiltersObject"
                class="model-filter-object"
                x="-153.79"
                y="44"
                width="240"
                height="225"
              >
                <div xmlns="http://www.w3.org/1999/xhtml" class="model-filter-ui">
                  <section class="filter-panel model-filter-panel" aria-label="Filtros de visualización">
                    <h2>Filtros</h2>
                    <div class="model-filter-stack">
                      <label class="filter-row" for="labelsFilterCheckbox">
                        <input id="labelsFilterCheckbox" type="checkbox" checked />
                        <span>Cámaras / sumideros</span>
                      </label>
                    </div>
                  </section>
                  <section class="filter-panel progress-panel" aria-labelledby="progressTitle" aria-live="polite">
                    <h2 id="progressTitle">Porcentaje de avance</h2>
                    <div class="progress-list">
                      <div class="progress-row">
                        <span class="progress-label">Colectores:</span>
                        <span id="collectorProgressText" class="progress-value">0 m / 0 m; 0 %</span>
                      </div>
                      <div class="progress-row">
                        <span class="progress-label">Tirantes:</span>
                        <span id="branchProgressText" class="progress-value">0 m / 0 m; 0 %</span>
                      </div>
                    </div>
                    <p id="branchProgressWarning" class="progress-warning" hidden></p>
                  </section>
                </div>
              </foreignObject>

              <foreignObject
                id="modelActivityObject"
                class="model-activity-object"
                x="-153.79"
                y="350"
                width="240"
                height="990"
              >
                <div xmlns="http://www.w3.org/1999/xhtml" class="model-filter-ui model-activity-ui">
                  <div class="actions">
                    <button id="openActivityButton" class="activity-btn" type="button">Registrar actividad</button>
                  </div>
                  <section class="panel" aria-live="polite">
                    <div class="activities-heading">
                      <h2>Actividades registradas</h2>
                      <button id="groupActivitiesButton" class="group-activities-btn" type="button" disabled>Agrupar</button>
                    </div>
                    <p id="groupActivitiesMessage" class="group-activities-message"></p>
                    <p id="activitiesEmpty" class="activities-empty">Todavía no hay actividades.</p>
                    <div id="activitiesWrapper" class="table-wrap">
                      <table class="activities">
                        <thead><tr><th></th><th>Dir</th><th>Long</th><th>Fecha</th><th></th></tr></thead>
                        <tbody id="activitiesBody"></tbody>
                      </table>
                    </div>
                  </section>
                </div>
              </foreignObject>
            </svg>
            <div id="status"></div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <div id="attributeModal" class="backdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="attrTitle">
      <h2 id="attrTitle">Atributos de la línea</h2>
      <p id="attrSubtitle" class="modal-subtitle"></p>
      <table class="attr-table">
        <tbody>
          <tr><th scope="row">Longitud</th><td><input id="lineLengthInput" type="text" inputmode="decimal" placeholder="Ej.: 38,87" autocomplete="off" /></td></tr>
          <tr><th scope="row">Diámetro</th><td><input id="diameterInput" type="text" placeholder="Ej.: 440 mm" autocomplete="off" /></td></tr>
        </tbody>
      </table>
      <div id="attributeFormError" class="form-error"></div>
      <div class="modal-actions"><button id="cancelAttrButton" class="secondary" type="button">Cancelar</button><button id="saveAttrButton" type="button">Guardar</button></div>
    </section>
  </div>

  <div id="nodeNameModal" class="backdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="nodeNameTitle">
      <h2 id="nodeNameTitle">Editar designación</h2>
      <p id="nodeNameSubtitle" class="modal-subtitle"></p>
      <div class="form-field">
        <label for="nodeNameInput">Nombre</label>
        <input id="nodeNameInput" type="text" autocomplete="off" placeholder="Ej.: CA1 o X1" />
      </div>
      <div id="nodeNameError" class="form-error"></div>
      <div class="modal-actions">
        <button id="cancelNodeNameButton" class="secondary" type="button">Cancelar</button>
        <button id="saveNodeNameButton" type="button">Guardar</button>
      </div>
    </section>
  </div>

  <div id="activityModal" class="backdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="activityTitle">
      <h2 id="activityTitle">Registrar actividad</h2>
      <p class="modal-subtitle">Indica el tramo ejecutado y la fecha en que se realizó.</p>
      <form id="activityForm" novalidate>
        <div class="form-grid">
          <div class="form-field"><label for="startCameraInput">Cámara de inicio</label><input id="startCameraInput" type="text" placeholder="Ej.: CA5" autocomplete="off" required /></div>
          <div class="form-field"><label for="endCameraInput">Cámara de fin</label><input id="endCameraInput" type="text" placeholder="Ej.: CA11" autocomplete="off" required /></div>
          <div class="form-field">
            <label for="activityLengthInput">Longitud (m)</label>
            <input id="activityLengthInput" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Ej.: 25" required />
            <label class="full-length-option" for="activityFullLengthCheckbox">
              <input id="activityFullLengthCheckbox" class="full-length-checkbox" type="checkbox" />
              <span>Longitud completa del tramo</span>
            </label>
            <div id="activityFullLengthHint" class="activity-length-hint" aria-live="polite"></div>
          </div>
          <div class="form-field"><label for="activityDateInput">Fecha</label><input id="activityDateInput" type="date" required /></div>
        </div>
        <div id="activityFormError" class="form-error"></div>
        <div class="modal-actions"><button id="cancelActivityButton" class="secondary" type="button">Cancelar</button><button type="submit">Guardar actividad</button></div>
      </form>
    </section>
  </div>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const STORAGE_KEY = "redVerde_autocad_pdf_distancias_reales_v1";
    const LINE_SETTINGS_KEY = "redVerde_autocad_line_settings_v1";
    const NODE_SETTINGS_KEY = "redVerde_autocad_node_settings_v1";
    const FILTER_SETTINGS_KEY = "redVerde_autocad_filter_settings_v1";
    const DOUBLE_TAP_DELAY = 320;

        fullMeasure.remove();
        return def.d;
      }

      const startRadius = Math.max(0, Number(nodeMap.get(def.from)?.radius) || 0);
      const endRadius = Math.max(0, Number(nodeMap.get(def.to)?.radius) || 0);
      const maximumTrim = Math.max(0, total - 0.001);
      const requestedTrim = startRadius + endRadius;
      const trimScale = requestedTrim > maximumTrim && requestedTrim > 0 ? maximumTrim / requestedTrim : 1;
      const visibleStart = startRadius * trimScale;
      const visibleEnd = total - endRadius * trimScale;
      const visiblePath = poly(fullMeasure, visibleStart, visibleEnd, 0);
      fullMeasure.remove();
      return visiblePath;
    }

    function addDistanceLabel(measure, def) {
      if (!hasKnownLength(def)) return null;
      const total = measure.getTotalLength();
      const m = total / 2;
      const p = measure.getPointAtLength(m);
      const before = measure.getPointAtLength(Math.max(0, m - 2));
      const after = measure.getPointAtLength(Math.min(total, m + 2));
      const ang = Math.atan2(after.y - before.y, after.x - before.x);
      let deg = ang * 180 / Math.PI;
      if (deg > 90 || deg < -90) deg += 180;
      const nx = -Math.sin(ang), ny = Math.cos(ang);
      const offset = def.kind === 'branch' ? -16 : -14;
      const x = p.x + nx * offset, y = p.y + ny * offset;
      const textValue = `${formatLength(def.meters)} m`;
      const group = E('g', { class: 'distance-group', transform: `rotate(${deg} ${x} ${y})`, 'data-line-id': def.id });
      const width = Math.max(34, textValue.length * 7.8);
      const hit = E('rect', { class: 'distance-hit', x: x - width/2, y: y - 10, width, height: 20, rx: 5, ry: 5 });
      const label = E('text', { class: `distance-text ${def.kind}`, x, y });
      label.textContent = textValue;

      let lastTap = 0;
      group.addEventListener('pointerup', (event) => {
        if (commentPlacementMode) return;
        event.preventDefault();
        event.stopPropagation();

        const now = Date.now();
        if (now - lastTap <= DOUBLE_TAP_DELAY) {
          if (timer) clearTimeout(timer);
          timer = null;
          lastTap = 0;
          openAttributes(def.id);
          return;
        }
        lastTap = now;
        timer = setTimeout(() => { timer = null; }, DOUBLE_TAP_DELAY);
      });
      group.append(hit, label);
      distanceLabelsGroup.appendChild(group);
      return group;
    }

    function addSegmentGuides(measure, def) {
      const group = E('g', { class: 'segment-guides', 'data-line-id': def.id });
      segmentGuidesGroup.appendChild(group);
      if (!hasKnownLength(def)) return group;

      const lens = lengths(def.meters);
      const total = measure.getTotalLength();
      let acc = 0;
      for (let i=0; i<lens.length-1; i++) {
        acc += lens[i];
        const l = total * (acc / def.meters);
        const p = measure.getPointAtLength(l);
        const before = measure.getPointAtLength(Math.max(0, l - 1.5));
        const after = measure.getPointAtLength(Math.min(total, l + 1.5));
        const dx = after.x - before.x, dy = after.y - before.y;
        const d = Math.hypot(dx, dy) || 1;
        const nx = -dy / d, ny = dx / d;
        const half = def.kind === 'collector' ? 6 : 4.8;
        const tick = E('line', { class: 'segment-guide', x1: p.x - nx*half, y1: p.y - ny*half, x2: p.x + nx*half, y2: p.y + ny*half });

      return group;
    }

    function setShortSegmentSelectorTransform(group) {

    function addShortSegmentSelector(state, segmentIndex, startSvgLength, endSvgLength) {

    function applyViewBox() {
      svg.setAttribute('viewBox', `${currentViewBox.x} ${currentViewBox.y} ${currentViewBox.width} ${currentViewBox.height}`);

    }

    function updateGuideVisibility() {
      const show = currentViewBox.width <= INITIAL_VIEW_BOX.width * GUIDE_VISIBILITY_RATIO;
      document.querySelectorAll('.segment-guides').forEach(g => g.classList.toggle('visible', show));
      shortSegmentSelectorsGroup.classList.toggle('visible', show);

    function clampViewBox() {
      const aspect = INITIAL_VIEW_BOX.height / INITIAL_VIEW_BOX.width;
      currentViewBox.width = Math.min(MAX_VIEW_BOX_WIDTH, Math.max(MIN_VIEW_BOX_WIDTH, currentViewBox.width));
      currentViewBox.height = currentViewBox.width * aspect;
      const hMargin = currentViewBox.width * 0.35;
      const vMargin = currentViewBox.height * 0.35;
      const minX = INITIAL_VIEW_BOX.x - hMargin;
      const maxX = INITIAL_VIEW_BOX.x + INITIAL_VIEW_BOX.width - currentViewBox.width + hMargin;
      const minY = INITIAL_VIEW_BOX.y - vMargin;
      const maxY = INITIAL_VIEW_BOX.y + INITIAL_VIEW_BOX.height - currentViewBox.height + vMargin;
      currentViewBox.x = Math.min(Math.max(currentViewBox.x, Math.min(minX,maxX)), Math.max(minX,maxX));
      currentViewBox.y = Math.min(Math.max(currentViewBox.y, Math.min(minY,maxY)), Math.max(minY,maxY));

    function clientToSvg(clientX, clientY) {
      const p = svg.createSVGPoint(); p.x = clientX; p.y = clientY;
      const m = svg.getScreenCTM();

      return p.matrixTransform(m.inverse());

      currentViewBox.x = center.x - (center.x - currentViewBox.x) * actual;
      currentViewBox.y = center.y - (center.y - currentViewBox.y) * actual;
      currentViewBox.width = boundedW; currentViewBox.height *= actual;
      clampViewBox(); applyViewBox();
    }

    function resetView() { currentViewBox = { ...INITIAL_VIEW_BOX }; applyViewBox(); }

      let lastEmptyTapY = 0;

      }, { capture:true });

          currentViewBox.y -= currentPoint.y - previousPoint.y;

    function closestLengthOnPath(path, target) {
      const total = path.getTotalLength();
      const coarse = 120;
      let best = 0, bestDist = Infinity;
      for (let i=0; i<=coarse; i++) {
        const len = total * (i / coarse); const p = path.getPointAtLength(len);
        const dist = (p.x-target.x)**2 + (p.y-target.y)**2;
        if (dist < bestDist) { bestDist = dist; best = len; }
      }
      let radius = total / coarse;
      for (let it=0; it<12; it++) {
        for (const len of [Math.max(0,best-radius), Math.min(total,best+radius)]) {
          const p = path.getPointAtLength(len); const dist = (p.x-target.x)**2 + (p.y-target.y)**2;
          if (dist < bestDist) { bestDist = dist; best = len; }
        }
        radius /= 2;
      }
      return best;
    }

    function getSegmentIndexAtLength(state, selectedSvgLength) {
      if (!hasKnownLength(state.definition)) return 0;
      const lastIndex = state.segmentLengths.length - 1;
      const remainder = Number((state.definition.meters % 6).toFixed(2));
      if (remainder > 0 && lastIndex > 0) {
        const actualRemSvg = state.totalSvgLength * (remainder / state.definition.meters);
        const touchStart = Math.max(0, state.totalSvgLength - Math.max(MIN_REMAINDER_TOUCH_LENGTH, actualRemSvg));
        if (selectedSvgLength >= touchStart) return lastIndex;
      }
      const selectedMeters = state.definition.meters * (selectedSvgLength / state.totalSvgLength);
      let acc = 0;
      for (let i=0; i<state.segmentLengths.length; i++) {
        acc += state.segmentLengths[i];
        if (selectedMeters < acc || i === state.segmentLengths.length - 1) return i;
      }
      return lastIndex;
    }

    function isSegmentActive(state, index) { return state.activitySegmentCount[index] > 0; }
    function refreshSegment(state, index) {
      const active = isSegmentActive(state, index);
      state.segmentOverlays[index].classList.toggle('active', active);
      state.shortSegmentSelectors[index]?.classList.toggle('active', active);
    }
    function refreshFullLine(state) { state.fullOverlay.classList.toggle('active', state.segmentOverlays.every((_,i)=>isSegmentActive(state,i))); }
    function refreshLine(state) { state.segmentOverlays.forEach((_,i)=>refreshSegment(state,i)); refreshFullLine(state); }

    function getManualEndpoints(lineId) {
      const d = lineDefs.find(line => line.id === lineId);
      return d ? { start:d.from, end:d.to } : { start:'?', end:'?' };
    }

    function findManualActivity(lineId, segmentIndex) {
      return activities.find(a =>
        a.source === 'manual' &&
        Array.isArray(a.appliedSegments) &&
        a.appliedSegments.some(segment => segment.lineId === lineId && segment.segmentIndex === segmentIndex)
      );
    }

    function createManualActivity(lineId, segmentIndex) {
      const state = lineStates.get(lineId);
      const rawLength = state.segmentLengths[segmentIndex];
      const segmentLength = Number.isFinite(Number(rawLength)) ? Number(rawLength) : null;
      const endpoints = getManualEndpoints(lineId);
      return {
        id: (crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`),
        source: 'manual',
        startCamera: endpoints.start,
        endCamera: endpoints.end,
        length: segmentLength,
        appliedLength: segmentLength,
        appliedSegments: [{ lineId, segmentIndex, segmentLength }],
        date: ''
      };
    }

    function createManualGroup(template, segments, id=null) {
      const ordered = [...segments].sort((a,b) => a.segmentIndex - b.segmentIndex);
      const endpoints = getManualEndpoints(ordered[0]?.lineId);
      const knownLengths = ordered.map(segment => Number(segment.segmentLength)).filter(Number.isFinite);
      const appliedLength = knownLengths.length === ordered.length
        ? Number(knownLengths.reduce((sum, value) => sum + value, 0).toFixed(2))
        : null;
      return {
        ...template,
        id: id || (crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`),
        source: 'manual',
        startCamera: endpoints.start,
        endCamera: endpoints.end,
        length: appliedLength,
        appliedLength,
        appliedSegments: ordered.map(segment => ({ ...segment }))
      };
    }

    function splitConsecutiveSegments(segments) {
      const ordered = [...segments].sort((a,b) =>
        String(a.lineId).localeCompare(String(b.lineId)) || a.segmentIndex - b.segmentIndex
      );
      const groups = [];
      ordered.forEach(segment => {
        const current = groups[groups.length - 1];
        const previous = current?.[current.length - 1];
        if (!current || previous.lineId !== segment.lineId || segment.segmentIndex !== previous.segmentIndex + 1) {
          groups.push([segment]);
        } else {
          current.push(segment);
        }
      });
      return groups;
    }

    function toggleManualSegment(lineId, segmentIndex) {
      const existing = findManualActivity(lineId, segmentIndex);
      if (existing) {
        const activityIndex = activities.indexOf(existing);
        const remaining = existing.appliedSegments.filter(segment =>
          segment.lineId !== lineId || segment.segmentIndex !== segmentIndex
        );
        const replacements = splitConsecutiveSegments(remaining).map((segments, index) =>
          createManualGroup(existing, segments, index === 0 ? existing.id : null)
        );
        selectedActivityIds.delete(existing.id);
        activities.splice(activityIndex, 1, ...replacements);
      } else {
        activities.push(createManualActivity(lineId, segmentIndex));
      }
      saveActivities(); rebuildActivityMarks(); renderActivities();
    }

    function closeAttributes() {

    function todayInputDate() { const now = new Date(); const local = new Date(now.getTime() - now.getTimezoneOffset()*60000); return local.toISOString().slice(0,10); }

    function getNodeDisplayName(nodeId) {

    function loadActivities() { try { const saved = localStorage.getItem(STORAGE_KEY); const parsed = saved ? JSON.parse(saved) : []; return Array.isArray(parsed) ? parsed : []; } catch { return []; } }
    function saveActivities() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(activities)); } catch {} }

    function findPathBetweenCameras(startCamera, endCamera) {
      const queue = [{ camera:startCamera, path:[] }]; const visited = new Set([startCamera]);
      while (queue.length) {
        const current = queue.shift();
        if (current.camera === endCamera) return current.path;
        routeEdges.forEach(edge => {
          let next = null, forward = true;
          if (edge.from === current.camera) { next = edge.to; forward = true; }
          else if (edge.to === current.camera) { next = edge.from; forward = false; }
          if (!next || visited.has(next)) return;
          visited.add(next);
          queue.push({ camera:next, path: current.path.concat({ lineId:edge.lineId, forward }) });
        });
      }
      return null;
    }

    function getAvailableLength(startCamera, endCamera) {
      const path = findPathBetweenCameras(startCamera, endCamera);
      if (!path) {
        return { ok: false, availableLength: 0, message: 'No existe una ruta entre esas dos cámaras en la red actual.' };
      }

      let availableLength = 0;
      for (const step of path) {
        const state = lineStates.get(step.lineId);
        if (!state || !hasKnownLength(state.definition)) {
          return { ok: false, availableLength: 0, message: `Falta definir la longitud de ${state?.definition?.name || step.lineId}.` };
        }
        state.segmentLengths.forEach((segmentLength, segmentIndex) => {
          if (state.activitySegmentCount[segmentIndex] === 0 && Number.isFinite(Number(segmentLength))) {
            availableLength += Number(segmentLength);
          }
        });
      }
      return { ok: true, path, availableLength: Number(availableLength.toFixed(2)) };
    }

    function computeAppliedSegments(startCamera, endCamera, requestedLength) {
      const path = findPathBetweenCameras(startCamera, endCamera);
      if (!path) return { ok:false, message:'No existe una ruta entre esas dos cámaras en la red actual.' };
      let remaining = requestedLength;
      let appliedLength = 0;
      const appliedSegments = [];
      outerLoop:
      for (const step of path) {
        const state = lineStates.get(step.lineId);
        if (!state || !hasKnownLength(state.definition)) {
          return { ok:false, message:`Falta definir la longitud de ${state?.definition?.name || step.lineId}.` };
        }
        const indexes = step.forward ? state.segmentLengths.map((_,i)=>i) : state.segmentLengths.map((_,i)=>i).reverse();
        for (const segmentIndex of indexes) {
          const segmentLength = Number(state.segmentLengths[segmentIndex]);
          if (!Number.isFinite(segmentLength)) continue;
          if (state.activitySegmentCount[segmentIndex] > 0) continue;
          if (remaining + 1e-9 >= segmentLength) {
            appliedSegments.push({ lineId:step.lineId, segmentIndex, segmentLength });
            remaining -= segmentLength;
            appliedLength += segmentLength;
          } else {
            break outerLoop;
          }
        }
      }
      return { ok:true, path, appliedSegments, appliedLength:Number(appliedLength.toFixed(2)) };
    }

    function clearAllVisualMarks() { lineStates.forEach(state => { state.activitySegmentCount = state.activitySegmentCount.map(() => 0); refreshLine(state); }); }
    function applyActivityVisualMarks(activity) {
      if (!Array.isArray(activity.appliedSegments)) return;
      const touched = new Set();
      activity.appliedSegments.forEach(info => {
        const state = lineStates.get(info.lineId); if (!state) return; const idx = info.segmentIndex;
        if (idx < 0 || idx >= state.activitySegmentCount.length) return;
        state.activitySegmentCount[idx] += 1; touched.add(info.lineId);
      });
      touched.forEach(id => refreshLine(lineStates.get(id)));
    }

    function calculateLineProgress(kind) {
      let completedLength = 0;
      let totalLength = 0;
      let missingCount = 0;

      lineStates.forEach(state => {
        if (state.definition.kind !== kind) return;
        if (!hasKnownLength(state.definition)) {
          missingCount += 1;
          return;
        }

        totalLength += Number(state.definition.meters);
        state.segmentLengths.forEach((segmentLength, segmentIndex) => {
          if (!isSegmentActive(state, segmentIndex)) return;
          const value = Number(segmentLength);
          if (Number.isFinite(value)) completedLength += value;
        });
      });

      completedLength = Math.min(completedLength, totalLength);
      const percentage = totalLength > 0 ? completedLength / totalLength * 100 : 0;
      return {
        completedLength: Number(completedLength.toFixed(2)),
        totalLength: Number(totalLength.toFixed(2)),
        percentage: Number(percentage.toFixed(2)),
        missingCount
      };
    }

    function formatProgress(progress) {
      const knownLabel = progress.missingCount > 0 ? ' conocidos' : '';
      return `${formatLength(progress.completedLength)} m / ${formatLength(progress.totalLength)} m${knownLabel}; ${formatLength(progress.percentage)} %`;
    }

    function updateProgressPanel() {
      const collectorProgress = calculateLineProgress('collector');
      const branchProgress = calculateLineProgress('branch');
      collectorProgressText.textContent = formatProgress(collectorProgress);
      branchProgressText.textContent = formatProgress(branchProgress);
      branchProgressWarning.hidden = branchProgress.missingCount === 0;
      branchProgressWarning.textContent = branchProgress.missingCount === 1
        ? 'Falta por definir 1 longitud de tirante.'
        : `Faltan por definir ${branchProgress.missingCount} longitudes de tirantes.`;
    }

    function rebuildActivityMarks() {
      clearAllVisualMarks();
      activities.forEach(activity => {
        if (activity.source === 'manual') {
          if (!Array.isArray(activity.appliedSegments)) activity.appliedSegments = [];
          const known = activity.appliedSegments
            .map(segment => Number(segment.segmentLength))
            .filter(Number.isFinite);
          activity.appliedLength = known.length ? Number(known.reduce((sum, value) => sum + value, 0).toFixed(2)) : null;
          applyActivityVisualMarks(activity);
          return;
        }
        if (activity.source === 'manualNode') return;
        const result = computeAppliedSegments(activity.startCamera, activity.endCamera, activity.length);
        if (result.ok) {
          activity.appliedSegments = result.appliedSegments;
          activity.appliedLength = result.appliedLength;
          applyActivityVisualMarks(activity);
        } else {
          activity.appliedSegments = [];
          activity.appliedLength = 0;
        }
      });
      saveActivities();
      updateProgressPanel();
      checkVictory();
    }

    function setGroupActivitiesMessage(message='', type='') {
      groupActivitiesMessage.textContent = message;
      groupActivitiesMessage.classList.toggle('error', type === 'error');
      groupActivitiesMessage.classList.toggle('success', type === 'success');
    }

    function updateGroupActivitiesButton() {
      const selectedManualCount = activities.filter(activity =>
        activity.source === 'manual' && selectedActivityIds.has(activity.id)
      ).length;
      groupActivitiesButton.disabled = selectedManualCount < 2;
    }

    function groupSelectedActivities() {
      const selected = activities.filter(activity => selectedActivityIds.has(activity.id));
      if (selected.length < 2) {
        setGroupActivitiesMessage('Selecciona al menos dos actividades manuales.', 'error');
        return;
      }
      if (selected.some(activity => activity.source !== 'manual')) {
        setGroupActivitiesMessage('Solo se pueden agrupar actividades marcadas manualmente.', 'error');
        return;
      }

      const first = selected[0];
      if (selected.some(activity =>
        activity.startCamera !== first.startCamera ||
        activity.endCamera !== first.endCamera
      )) {
        setGroupActivitiesMessage('Las actividades deben pertenecer al mismo tramo y tener la misma dirección.', 'error');
        return;
      }
      if (selected.some(activity => (activity.date || '') !== (first.date || ''))) {
        setGroupActivitiesMessage('Las actividades deben tener la misma fecha.', 'error');
        return;
      }

      const segments = selected.flatMap(activity =>
        Array.isArray(activity.appliedSegments) ? activity.appliedSegments : []
      );
      const lineIds = new Set(segments.map(segment => segment.lineId));
      if (!segments.length || lineIds.size !== 1) {
        setGroupActivitiesMessage('Las actividades deben corresponder a una misma tubería.', 'error');
        return;
      }
      if (segments.some(segment => !Number.isFinite(Number(segment.segmentLength)))) {
        setGroupActivitiesMessage('Define primero la longitud de todos los segmentos seleccionados.', 'error');
        return;
      }

      const orderedSegments = [...segments].sort((a,b) => a.segmentIndex - b.segmentIndex);
      const uniqueIndexes = new Set(orderedSegments.map(segment => segment.segmentIndex));
      const areConsecutive = uniqueIndexes.size === orderedSegments.length && orderedSegments.every((segment, index) =>
        index === 0 || segment.segmentIndex === orderedSegments[index - 1].segmentIndex + 1
      );
      if (!areConsecutive) {
        setGroupActivitiesMessage('Selecciona segmentos consecutivos para poder agruparlos.', 'error');
        return;
      }

      const selectedIds = new Set(selected.map(activity => activity.id));
      const insertionIndex = Math.min(...selected.map(activity => activities.indexOf(activity)));
      const groupedActivity = createManualGroup(first, orderedSegments);
      activities = activities.filter(activity => !selectedIds.has(activity.id));
      activities.splice(insertionIndex, 0, groupedActivity);
      selectedActivityIds.clear();
      saveActivities();
      rebuildActivityMarks();
      renderActivities();
      setGroupActivitiesMessage(
        `Se agruparon ${selected.length} actividades en un registro de ${formatLength(groupedActivity.appliedLength)} m.`,
        'success'
      );
    }

    function renderActivities() {
      activitiesBody.innerHTML = '';
      selectedActivityIds.forEach(id => {
        const activity = activities.find(item => item.id === id);
        if (!activity || activity.source !== 'manual') selectedActivityIds.delete(id);
      });
      const has = activities.length > 0;
      activitiesEmpty.style.display = has ? 'none' : 'block';
      activitiesWrapper.style.display = has ? 'block' : 'none';
      activities.forEach(activity => {
        const row = document.createElement('tr');
        const selectCell = document.createElement('td');
        if (activity.source === 'manual') {
          const select = document.createElement('input');
          select.type = 'checkbox';
          select.className = 'activity-select';
          select.checked = selectedActivityIds.has(activity.id);
          select.setAttribute('aria-label', `Seleccionar actividad ${getNodeDisplayName(activity.startCamera)} a ${getNodeDisplayName(activity.endCamera)}`);
          select.addEventListener('change', () => {
            if (select.checked) selectedActivityIds.add(activity.id);
            else selectedActivityIds.delete(activity.id);
            setGroupActivitiesMessage();
            updateGroupActivitiesButton();
          });
          selectCell.appendChild(select);
        }
        const dir = document.createElement('td');
        dir.className = 'activity-dir';
        dir.textContent = `${getNodeDisplayName(activity.startCamera)} → ${getNodeDisplayName(activity.endCamera)}`;
        const len = document.createElement('td');
        const shownLength = activity.appliedLength ?? activity.length;
        len.textContent = shownLength !== null && shownLength !== undefined && Number.isFinite(Number(shownLength)) ? `${formatLength(shownLength)} m` : '—';
        const dateCell = document.createElement('td');
        const dateInput = document.createElement('input');
        dateInput.type = 'date';
        dateInput.className = 'date-input';
        dateInput.value = activity.date || '';
        dateInput.addEventListener('change', () => { activity.date = dateInput.value; saveActivities(); });
        dateCell.appendChild(dateInput);
        const actions = document.createElement('td');
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'delete-btn';
        del.textContent = '×';
        del.title = 'Eliminar actividad';
        del.addEventListener('click', () => {
          selectedActivityIds.delete(activity.id);
          activities = activities.filter(item => item.id !== activity.id);
          saveActivities();
          rebuildActivityMarks();
          refreshNodeStates();
          renderActivities();
        });
        actions.appendChild(del);
        row.append(selectCell, dir, len, dateCell, actions);
        activitiesBody.appendChild(row);
      });
      updateGroupActivitiesButton();
    }

    function updateFullLengthOption() {
      const useFullLength = activityFullLengthCheckbox.checked;
      activityLengthInput.disabled = useFullLength;
      activityLengthInput.required = !useFullLength;
      if (!useFullLength) {
        activityFullLengthHint.textContent = '';
        return;
      }

      const startCamera = resolveMainCameraName(startCameraInput.value);
      const endCamera = resolveMainCameraName(endCameraInput.value);
      if (!startCamera || !endCamera || startCamera === endCamera) {
        activityLengthInput.value = '';
        activityFullLengthHint.textContent = 'Indica dos cámaras válidas para calcular la longitud completa.';
        return;
      }

      const capacity = getAvailableLength(startCamera, endCamera);
      if (!capacity.ok) {
        activityLengthInput.value = '';
        activityFullLengthHint.textContent = capacity.message;
        return;
      }

      activityLengthInput.value = capacity.availableLength > 0 ? capacity.availableLength.toFixed(2) : '';
      activityFullLengthHint.textContent = capacity.availableLength > 0
        ? `Se registrarán ${formatLength(capacity.availableLength)} m disponibles.`
        : 'Este tramo ya está completamente registrado.';
    }

    function openActivityModal() {
      activityForm.reset();
      activityLengthInput.disabled = false;
      activityLengthInput.required = true;
      activityFullLengthHint.textContent = '';
      activityFormError.textContent = '';
      activityDateInput.value = todayInputDate();
      activityModal.classList.add('open');
      activityModal.setAttribute('aria-hidden','false');
      setTimeout(() => startCameraInput.focus(), 40);
    }
    function closeActivityModal() { activityModal.classList.remove('open'); activityModal.setAttribute('aria-hidden','true'); activityFormError.textContent=''; }

    function registerActivity(event) {
      event.preventDefault();
      const startText = normalizeName(startCameraInput.value);
      const endText = normalizeName(endCameraInput.value);
      const startCamera = resolveMainCameraName(startCameraInput.value);
      const endCamera = resolveMainCameraName(endCameraInput.value);
      const useFullLength = activityFullLengthCheckbox.checked;
      const date = activityDateInput.value;
      if (!startText || !endText) { activityFormError.textContent = 'Debes escribir la cámara de inicio y la cámara de fin.'; return; }
      if (!startCamera || !endCamera) { activityFormError.textContent = `Por ahora las cámaras válidas son: ${validCameras.map(getNodeDisplayName).join(', ')}.`; return; }
      if (startCamera === endCamera) { activityFormError.textContent = 'La cámara de inicio y la cámara de fin no pueden ser la misma.'; return; }
      if (!date) { activityFormError.textContent = 'Debes seleccionar una fecha.'; return; }

      const capacity = getAvailableLength(startCamera, endCamera);

      if (!capacity.ok) {
        activityFormError.textContent = capacity.message;
        return;
      }

      if (capacity.availableLength <= 0) {
        activityFormError.textContent =
          `Solo hay espacio para 0 m entre ${getNodeDisplayName(startCamera)} y ${getNodeDisplayName(endCamera)}. La línea ya está completa.`;
        return;
      }

      const lengthValue = useFullLength ? capacity.availableLength : Number(activityLengthInput.value);
      if (!Number.isFinite(lengthValue) || lengthValue <= 0) {
        activityFormError.textContent = 'La longitud debe ser un número mayor que cero.';
        return;
      }

      if (lengthValue > capacity.availableLength + 1e-9) {
        activityFormError.textContent =
          `Solo hay espacio para ${formatLength(capacity.availableLength)} m entre ${getNodeDisplayName(startCamera)} y ${getNodeDisplayName(endCamera)}.`;
        return;
      }

      const result = computeAppliedSegments(startCamera, endCamera, lengthValue);
      if (!result.ok) { activityFormError.textContent = result.message; return; }
      activities.push({ id: (crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`), source:'registered', startCamera, endCamera, length:Number(lengthValue.toFixed(2)), appliedLength:result.appliedLength, appliedSegments:result.appliedSegments, date });
      saveActivities(); rebuildActivityMarks(); renderActivities(); closeActivityModal();
    }

    function saveLineSettings() {
      const settings = {};
      lineDefs.forEach(def => {
        const state = lineStates.get(def.id);
        settings[def.id] = {
          meters: hasKnownLength(def) ? Number(def.meters) : null,
          diameter: state?.attributes?.diameter || ''
        };
      });
      try { localStorage.setItem(LINE_SETTINGS_KEY, JSON.stringify(settings)); } catch {}
    }

    function lineHasActivities(lineId) {
      return activities.some(activity =>
        Array.isArray(activity.appliedSegments) &&
        activity.appliedSegments.some(segment => segment.lineId === lineId)
      );
    }

    function buildLine(def) {
      const branch = def.kind === 'branch';
      const base = E('path', { class: `base-line${branch ? ' branch' : ''}`, d:def.d });
      baseLinesGroup.appendChild(base);
      const visibleD = visibleLinePath(def);
      const measure = E('path', { class:'measure-path', d:visibleD, fill:'none', stroke:'none' });
      svg.appendChild(measure);
      const total = measure.getTotalLength();
      const knownLength = hasKnownLength(def);
      const segmentLengths = knownLength ? lengths(def.meters) : [null];
      const fullOverlay = E('path', { class: `full-overlay${branch ? ' branch' : ''}`, d:visibleD });
      fullLineOverlaysGroup.appendChild(fullOverlay);
      const saved = savedLineSettings[def.id] || {};
      const state = {
        definition:def,
        measurePath:measure,
        totalSvgLength:total,
        segmentLengths,
        segmentOverlays:[],
        activitySegmentCount:segmentLengths.map(()=>0),
        shortSegmentSelectors:[],
        fullOverlay,
        guideGroup:null,
        distanceGroup:null,
        attributes:{ diameter: typeof saved.diameter === 'string' ? saved.diameter : '' }
      };

      if (knownLength) {
        let acc = 0;
        segmentLengths.forEach((segmentMeters, segmentIndex) => {
          const start = total * (acc / def.meters);
          const end = total * ((acc + segmentMeters) / def.meters);
          const overlay = E('path', { class: `segment-overlay${branch ? ' branch' : ''}`, d: poly(measure, start, end) });
          state.segmentOverlays.push(overlay);
          segmentOverlaysGroup.appendChild(overlay);
          state.shortSegmentSelectors[segmentIndex] = addShortSegmentSelector(state, segmentIndex, start, end);
          acc += segmentMeters;
        });
      } else {
        const overlay = E('path', { class: `segment-overlay${branch ? ' branch' : ''}`, d:visibleD });
        state.segmentOverlays.push(overlay);
        segmentOverlaysGroup.appendChild(overlay);
      }

      const hit = E('path', { class:'hit', d:visibleD });
      lineHitboxesGroup.appendChild(hit);
      state.guideGroup = addSegmentGuides(measure, def);
      state.distanceGroup = addDistanceLabel(measure, def);
      lineStates.set(def.id, state);
      hit.addEventListener('pointerup', (event) => {
        if (commentPlacementMode) return;
        event.preventDefault();
        if (shouldSuppressTap(event)) return;
        const point = clientToSvg(event.clientX, event.clientY);
        const index = getSegmentIndexAtLength(state, closestLengthOnPath(measure, point));
        toggleManualSegment(def.id, index);
      });
    }

    function buildNodes() {
      nodeDefs.forEach(n => {
        const circle = E('circle', { class:`node${n.main ? ' main' : ''}`, cx:n.x, cy:n.y, r:n.radius, 'data-node-id':n.id, 'data-active':'false' });
        circle.addEventListener('pointerup', (event) => { if (commentPlacementMode || shouldSuppressTap(event)) return; toggleNode(n.id); });
        nodesGroup.appendChild(circle);

        if (n.main) {
          const ring = E('circle', {
            class: 'camera-ring',
            cx: n.x,
            cy: n.y,
            r: n.radius - 1.05
          });
          nodesGroup.appendChild(ring);
        }
      });
      placeLabels();
    }

    function placeLabels() {
      labelsGroup.innerHTML = '';
      nodeDefs.forEach(n => {
        if (n.showLabel === false) return;
        let x = n.x, y = n.y;
        const cls = n.main ? 'main' : 'terminal';
        if (n.main) {
          const candidates = [[42,-26],[44,22],[-42,-26],[-44,22],[0,-36],[0,36]];
          let best = candidates[0], score = 1e9;
          for (const [dx,dy] of candidates) {
            const bx = x + dx, by = y + dy;
            let sc = 0;
            nodeDefs.forEach(m => { if (m.id !== n.id && Math.hypot(bx - m.x, by - m.y) < 28) sc += 100; });
            lineStates.forEach(st => { const t = st.measurePath.getTotalLength(); for (let l=0; l<t; l+=10) { const p = st.measurePath.getPointAtLength(l); if (Math.hypot(bx - p.x, by - p.y) < 18) sc += 6; } });
            if (sc < score) { score = sc; best = [dx,dy]; }
          }
          x += best[0]; y += best[1];
        } else {
          const p = nodeMap.get(n.parent); const dx = x - p.x, dy = y - p.y; const len = Math.hypot(dx,dy) || 1;
          x += dx / len * 24; y += dy / len * 16;
        }
        const text = E('text', {
          class:`node-label ${cls}`,
          x,
          y,
          'data-node-id': n.id,
          role: 'button',
          'aria-label': `Editar nombre de ${n.displayName || n.id}`
        });
        text.textContent = n.displayName || n.id;

        let labelTapTimer = null;
        let lastLabelTap = 0;
        text.addEventListener('pointerup', event => {
          if (commentPlacementMode) return;
          event.preventDefault();
          event.stopPropagation();
          if (shouldSuppressTap(event)) return;
          const now = Date.now();
          if (now - lastLabelTap <= DOUBLE_TAP_DELAY) {
            if (labelTapTimer) clearTimeout(labelTapTimer);
            labelTapTimer = null;
            lastLabelTap = 0;
            openNodeNameEditor(n.id);
            return;
          }
          lastLabelTap = now;
          labelTapTimer = setTimeout(() => { labelTapTimer = null; }, DOUBLE_TAP_DELAY);
        });
        text.addEventListener('dblclick', event => {
          if (commentPlacementMode) return;
          event.preventDefault();
          event.stopPropagation();
          openNodeNameEditor(n.id);
        });

        labelsGroup.appendChild(text);
      });
    }

    function toggleNode(id) {
      const existing = activities.find(a => a.source === 'manualNode' && a.nodeId === id);
      if (existing) activities = activities.filter(a => a.id !== existing.id);
      else activities.push({ id:(crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`), source:'manualNode', nodeId:id, startCamera:id, endCamera:id, length:0, appliedLength:0, appliedSegments:[], date:'' });
      refreshNodeStates(); saveActivities(); renderActivities(); checkVictory();
    }

    function refreshNodeStates() {
      const activeIds = new Set(activities.filter(a => a.source === 'manualNode').map(a => a.nodeId));
      document.querySelectorAll('.node').forEach(node => { const active = activeIds.has(node.dataset.nodeId); node.dataset.active = active ? 'true' : 'false'; node.classList.toggle('active', active); });
    }

    function checkVictory() {
      const allNodesActive = [...document.querySelectorAll('.node')].every(node => node.dataset.active === 'true');
      const allSegmentsActive = [...lineStates.values()].every(state => state.segmentOverlays.every((_,i) => isSegmentActive(state,i)));
      status.textContent = allNodesActive && allSegmentsActive ? '¡Red completada!' : '';
    }

    buildNodes();
    lineDefs.forEach(buildLine);
    placeLabels();

    const savedFilterSettings = loadFilterSettings();
    labelsFilterCheckbox.checked = savedFilterSettings.showPointNames !== false;
    applyPointNameFilter();
    labelsFilterCheckbox.addEventListener('change', () => {
      applyPointNameFilter();
      saveFilterSettings();
    });

    setupZoomPan();
    resetView();
    window.addEventListener('pageshow', resetView);
    activities = loadActivities().map(a => ({ source:'registered', date:'', ...a }));
    rebuildActivityMarks();
    refreshNodeStates();
    renderActivities();

    resetButton?.addEventListener('click', () => {
      activities = [];
      selectedActivityIds.clear();
      setGroupActivitiesMessage();
      saveActivities();
      rebuildActivityMarks();
      refreshNodeStates();
      renderActivities();
      checkVictory();
    });

    saveAttrButton.addEventListener('click', () => {
      if (selectedLineId === null) return;
      const state = lineStates.get(selectedLineId);
      const newLength = parseLength(lineLengthInput.value);
      if (!Number.isFinite(newLength) || newLength <= 0) {
        attributeFormError.textContent = 'La longitud debe ser un número mayor que cero.';
        return;
      }

      const lengthChanged = Math.abs(newLength - Number(state.definition.meters)) > 0.000001;
      if (lengthChanged && lineHasActivities(selectedLineId)) {
        attributeFormError.textContent = 'Para cambiar esta longitud, elimina primero las actividades registradas en esta línea.';
        return;
      }

      state.definition.meters = Number(newLength.toFixed(2));
      state.definition.hasDistance = true;
      state.attributes.diameter = diameterInput.value.trim();
      saveLineSettings();

      if (lengthChanged) {
        window.location.reload();
      } else {
        closeAttributes();
      }
    });
    cancelAttrButton.addEventListener('click', closeAttributes);
    saveNodeNameButton.addEventListener('click', saveNodeName);
    cancelNodeNameButton.addEventListener('click', closeNodeNameEditor);
    nodeNameInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        saveNodeName();
      }
    });
    openActivityButton.addEventListener('click', openActivityModal);
    groupActivitiesButton.addEventListener('click', groupSelectedActivities);
    cancelActivityButton.addEventListener('click', closeActivityModal);
    activityFullLengthCheckbox.addEventListener('change', updateFullLengthOption);
    startCameraInput.addEventListener('input', () => {
      if (activityFullLengthCheckbox.checked) updateFullLengthOption();
    });
    endCameraInput.addEventListener('input', () => {
      if (activityFullLengthCheckbox.checked) updateFullLengthOption();
    });
    activityForm.addEventListener('submit', registerActivity);
    attributeModal.addEventListener('pointerdown', (event) => { if (event.target === attributeModal) closeAttributes(); });
    nodeNameModal.addEventListener('pointerdown', (event) => { if (event.target === nodeNameModal) closeNodeNameEditor(); });
    activityModal.addEventListener('pointerdown', (event) => { if (event.target === activityModal) closeActivityModal(); });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (attributeModal.classList.contains('open')) closeAttributes();
      if (nodeNameModal.classList.contains('open')) closeNodeNameEditor();
      if (activityModal.classList.contains('open')) closeActivityModal();
    });
  </script>
