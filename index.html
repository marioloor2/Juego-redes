    .short-segment-selector.active .short-segment-leader, .short-segment-selector.active .short-segment-pill { stroke: #16a34a; }

    .model-filter-panel { margin: 0; width: 100%; box-shadow: 0 5px 16px rgba(0,0,0,.12); }

    button { border: 0; border-radius: 12px; padding: 12px 18px; background: #111; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }

    html[data-theme="night"] {
      color-scheme: dark;
      background: #070b14;
    }
    html[data-theme="night"] body,
    html[data-theme="night"] .app,
    html[data-theme="night"] .network-shell,
    html[data-theme="night"] .viewport,
    html[data-theme="night"] svg {
      background: #070b14;
      color: #f8fafc;
    }
    html[data-theme="night"] .model-title,
    html[data-theme="night"] .zoom-btn,
    html[data-theme="night"] .quick-action-btn,
    html[data-theme="night"] .theme-toggle-button,
    html[data-theme="night"] .model-filter-toggle,
    html[data-theme="night"] .version-library-toggle {
      border-color: #475569;
      background: rgba(15,23,42,.96);
      color: #f8fafc;
      box-shadow: 0 3px 14px rgba(0,0,0,.36);
    }
    html[data-theme="night"] .base-line { stroke: #f8fafc; }
    html[data-theme="night"] .node { fill: #f8fafc; stroke: #0f172a; }
    html[data-theme="night"] .node.active { fill: #22c55e; }
    html[data-theme="night"] .camera-ring { stroke: #fb7185; }
    html[data-theme="night"] .headwall-shape { stroke: #f8fafc; }
    html[data-theme="night"] .node.discharge.active .headwall-shape { stroke: #22c55e; }
    html[data-theme="night"] .node-label {
      fill: #f8fafc;
      stroke: #070b14;
    }
    html[data-theme="night"] .node-label.sump,
    html[data-theme="night"] .node-label.discharge { fill: #e2e8f0; }
    html[data-theme="night"] .distance-text {
      fill: #cbd5e1;
      stroke: #070b14;
      opacity: .95;
    }
    html[data-theme="night"] .segment-guide { stroke: #94a3b8; }
    html[data-theme="night"] .short-segment-leader,
    html[data-theme="night"] .short-segment-pill { stroke: #cbd5e1; }
    html[data-theme="night"] .short-segment-pill { fill: #0f172a; }
    html[data-theme="night"] .short-segment-text { fill: #f8fafc; }

<body>
  <main class="app">
    <div class="layout">
      <section class="network-col">
        <div class="network-shell">

            <div class="model-header">

              </div>
              <div class="quick-actions" aria-label="Registrar información">
                <button id="openActivityButton" class="zoom-btn quick-action-btn" type="button" aria-label="Registrar actividad">Actividad</button>
                <button id="toggleCommentModeButton" class="zoom-btn quick-action-btn comment-btn" type="button" aria-label="Registrar comentario" aria-pressed="false">Comentario</button>

                  data-state="idle"

                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 3h13.6L21 6.4V21H3V4a1 1 0 0 1 1-1Zm2 2v5h10V5H6Zm0 14h12v-6H6v6Zm8-13h2v3h-2V6Z" />

              </div>
            </div>
            <div class="model-left-overlays">
              <aside id="modelFiltersObject" class="model-filter-object model-filter-overlay" aria-label="Filtros y porcentaje de avance">
                <button
                  id="modelFiltersToggle"
                  class="model-filter-toggle"
                  type="button"
                  aria-expanded="true"
                  aria-controls="modelFiltersContent"
                >
                  <span>Filtros y avance</span>
                  <span class="model-filter-toggle-icon" aria-hidden="true">⌄</span>
                </button>
                <div id="modelFiltersContent" class="model-filter-content"></div>

              <aside id="modelRecordsObject" class="model-records-overlay" aria-label="Registros de actividades y obstrucciones">

                  id="modelRecordsToggle"

                    <button id="recordsObstructionsTab" class="records-tab" type="button" role="tab" aria-selected="false">Obstrucciones</button>
                  </div>
                  <div id="modelRecordsPanels"></div>

            </div>
            <svg id="networkSvg" viewBox="-175 34.53 1157.19 1370.95" preserveAspectRatio="xMidYMid meet" aria-label="Red esquemática desde AutoCAD">
              <g id="baseLinesGroup"></g>
              <g id="segmentGuidesGroup"></g>
              <g id="segmentOverlaysGroup"></g>

                  <section class="filter-panel model-filter-panel" aria-label="Filtros de visualización">
                    <h2>Filtros</h2>

                      <label class="filter-row" for="labelsFilterCheckbox">
                        <input id="labelsFilterCheckbox" type="checkbox" checked />
                        <span id="pointCountsText">ID Cámaras</span>
                      </label>
                    </div>

                  <section class="filter-panel progress-panel" aria-labelledby="progressTitle" aria-live="polite">

              <foreignObject
                id="modelActivityObject"
                class="model-activity-object"
                visibility="hidden"
                x="-153.79"

                width="240"

                      <table class="activities">
                        <thead><tr><th></th><th>Dir</th><th>Long</th><th>Fecha</th><th></th></tr></thead>
                        <tbody id="activitiesBody"></tbody>
                      </table>
                    </div>
                    <button id="toggleAllActivitiesButton" class="activities-toggle" type="button" hidden>Ver todas</button>
                  </section>

            <script>
              (() => {
                const source = document.getElementById('modelFiltersSvgSource');
                const content = document.getElementById('modelFiltersContent');
                const interfaceElement = source?.querySelector('.model-filter-ui');
                if (content && interfaceElement) content.appendChild(interfaceElement);
                source?.remove();

                const recordsSource = document.getElementById('modelActivityObject');
                const recordsPanels = document.getElementById('modelRecordsPanels');
                const recordsInterface = recordsSource?.querySelector('.model-activity-ui');
                if (recordsPanels && recordsInterface) recordsPanels.appendChild(recordsInterface);
                recordsSource?.remove();
              })();
            </script>
            <div id="status"></div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script>
    (() => {
      const THEME_KEY = "redVerde_theme_v1";
      const themeButton = document.getElementById("themeToggleButton");
      const themeColor = document.querySelector('meta[name="theme-color"]');

      function applyTheme(night, persist = true) {
        document.documentElement.dataset.theme = night ? "night" : "day";
        themeButton.textContent = night ? "☀" : "☾";
        themeButton.setAttribute("aria-pressed", night ? "true" : "false");
        themeButton.setAttribute(
          "aria-label",
          night ? "Activar modo claro" : "Activar modo nocturno"
        );
        themeButton.title = night ? "Modo claro" : "Modo nocturno";
        themeColor?.setAttribute("content", night ? "#070b14" : "#ffffff");
        if (!persist) return;
        try {
          localStorage.setItem(THEME_KEY, night ? "night" : "day");
        } catch {}
      }

      applyTheme(document.documentElement.dataset.theme === "night", false);
      themeButton.addEventListener("click", () => {
        applyTheme(document.documentElement.dataset.theme !== "night");
      });
    })();
  </script>

  <div id="attributeModal" class="backdrop" aria-hidden="true">

  <div id="activityModal" class="backdrop" aria-hidden="true">

        <div class="form-grid">
          <div class="form-field"><label for="startCameraInput">Cámara de inicio</label><input id="startCameraInput" type="text" placeholder="Ej.: CA5" autocomplete="off" required /></div>

        <div class="modal-actions"><button id="cancelActivityButton" class="secondary" type="button">Cancelar</button><button type="submit">Guardar actividad</button></div>
      </form>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const STORAGE_KEY = "redVerde_autocad_pdf_distancias_reales_v1";
    const ACTIVITY_SEGMENT_ORDER_VERSION = 1;
    const LINE_SETTINGS_KEY = "redVerde_autocad_line_settings_v1";
    const NODE_SETTINGS_KEY = "redVerde_autocad_node_settings_v1";
    const FILTER_SETTINGS_KEY = "redVerde_autocad_filter_settings_v1";
    const DOUBLE_TAP_DELAY = 320;
    const MIN_REMAINDER_TOUCH_LENGTH = 22;
    const GUIDE_VISIBILITY_RATIO = 0.58;

    // Modelo de dominio inicial. AALL es la primera familia formalizada; las
    // futuras redes AASS y AAPP tendran sus propios catalogos y validaciones.
    const NETWORK_TYPE = 'AALL';
    const AALL_PIPE_LABEL_RULES = Object.freeze({
      length: Object.freeze({
        prefixes: ['L'],
        unit: 'm',
        gameAttribute: 'length',
        requiredForGame: true
      }),
      diameter: Object.freeze({
        symbols: ['Ø', 'Φ', 'phi'],
        defaultUnit: 'mm',
        gameAttribute: 'diameter',
        requiredForGame: false
      }),
      contextualOnly: Object.freeze({
        material: Object.freeze({
          examples: ['PVC NF'],
          aliases: Object.freeze({ 'PVC NF': 'PVC Novafort' }),
          storedByGame: false
        }),
        slope: Object.freeze({
          prefixes: ['P', 'S'],
          unit: '%',
          interpretation: '5% = 0.05 m/m = 5 cm por metro',
          storedByGame: false
        }),
        invertEntry: Object.freeze({
          prefix: 'IE',
          meaning: 'Cota de entrada del invert de la tubería',
          storedByGame: false
        }),
        invertExit: Object.freeze({
          prefix: 'IS',
          meaning: 'Cota de salida del invert de la tubería',
          storedByGame: false
        })
      })
    });
    const NETWORK_DEFINITION = Object.freeze({
      type: NETWORK_TYPE,
      name: 'Red de aguas lluvias',
      aliases: ['AL'],
      operatingPrinciple: 'gravity',
      structureRules: Object.freeze({
        multipleDischargesAllowed: true,
        disconnectedSectionsAllowed: true,
        eachSectionMayEndAtDischarge: true
      }),
      flowRules: Object.freeze({
        operatingPrinciple: 'gravity',
        cadArrowBlockNames: ['AL_FLUJO'],
        arrowTipMeaning: 'downstream',
        arrowMustBeAlignedWithPipe: true,
        tieDirection: 'sump-to-chamber',
        collectorDirection: 'toward-discharge',
        storeAsTopology: true,
        countAsConstructedElement: false
      }),

    function normalizeAallModel() {
      lineDefs.forEach(line => {
        line.networkType = NETWORK_TYPE;
        line.elementType = line.elementType || (line.kind === 'branch' ? 'tie' : 'collector');
        line.kind = line.elementType === 'tie' ? 'branch' : 'collector';
        line.requiredAttributes = ['length'];
        line.optionalAttributes = ['identifier', 'diameter'];
      });

      nodeDefs.forEach(node => {
        node.networkType = NETWORK_TYPE;
        node.elementType = CURRENT_MODEL_NODE_TYPES[node.id]
          || node.elementType
          || (node.main ? 'chamber' : 'sump');
        node.main = node.elementType === 'chamber';
        if (node.elementType === 'chamber') node.radius = Math.max(12, Number(node.radius) || 0);
        if (node.elementType === 'sump') node.radius = 6;
        if (node.elementType === 'discharge') node.radius = Math.max(6, Number(node.radius) || 0);
        node.identifierRequired = NETWORK_DEFINITION.elementRules[node.elementType]?.identifierRequired === true;
        node.requiredAttributes = node.identifierRequired ? ['identifier'] : [];
        const configuredOptionalAttributes = NETWORK_DEFINITION.elementRules[node.elementType]?.optionalAttributes;
        node.optionalAttributes = Array.isArray(configuredOptionalAttributes)
          ? [...configuredOptionalAttributes]
          : (node.identifierRequired ? [] : ['identifier']);
      });

      // Las rutas de actividades se forman con todos los colectores que unan
      // cámaras. Las descargas son terminales y no se usan como cámara de ruta.
      const nodesById = new Map(nodeDefs.map(node => [node.id, node]));
      lineDefs.forEach(line => {
        const fromNode = nodesById.get(line.from);
        const toNode = nodesById.get(line.to);
        let explicitFlowFrom = line.flowFrom || null;
        let explicitFlowTo = line.flowTo || null;
        if (line.flowDirection === 'from-to') {
          explicitFlowFrom = line.from;
          explicitFlowTo = line.to;
        } else if (line.flowDirection === 'to-from') {
          explicitFlowFrom = line.to;
          explicitFlowTo = line.from;
        }

        if (line.elementType === 'tie') {
          const sump = fromNode?.elementType === 'sump' ? fromNode : toNode;
          const chamber = fromNode?.elementType === 'chamber' ? fromNode : toNode;
          if (sump?.elementType === 'sump' && chamber?.elementType === 'chamber') {
            line.flowConflict = Boolean(
              explicitFlowFrom && explicitFlowTo
              && (explicitFlowFrom !== sump.id || explicitFlowTo !== chamber.id)
            );
            line.flowFrom = sump.id;
            line.flowTo = chamber.id;
            line.flowDirectionSource = explicitFlowFrom ? 'cad-arrow' : 'gravity-topology';
          }
        } else if (explicitFlowFrom && explicitFlowTo) {
          line.flowFrom = explicitFlowFrom;
          line.flowTo = explicitFlowTo;
          line.flowDirectionSource = 'cad-arrow';
        }
      });

      // La construccion de AALL empieza en cada descarga y avanza aguas arriba.
      // Completa la direccion de flujo de los colectores por topologia para que
      // la modulacion de 6 m no dependa del orden arbitrario del trazado CAD.
      const collectorLinesByNode = new Map();
      lineDefs.filter(line => line.elementType === 'collector').forEach(line => {
        [line.from, line.to].forEach(nodeId => {
          if (!collectorLinesByNode.has(nodeId)) collectorLinesByNode.set(nodeId, []);
          collectorLinesByNode.get(nodeId).push(line);
        });
      });
      const downstreamQueue = nodeDefs
        .filter(node => node.elementType === 'discharge')
        .map(node => node.id);
      const visitedCollectorLines = new Set();
      const visitedDownstreamNodes = new Set(downstreamQueue);
      while (downstreamQueue.length) {
        const downstreamNodeId = downstreamQueue.shift();
        (collectorLinesByNode.get(downstreamNodeId) || []).forEach(line => {
          if (visitedCollectorLines.has(line.id)) return;
          visitedCollectorLines.add(line.id);
          const upstreamNodeId = line.from === downstreamNodeId ? line.to : line.from;
          if (!line.flowFrom || !line.flowTo) {
            line.flowFrom = upstreamNodeId;
            line.flowTo = downstreamNodeId;
            line.flowDirectionSource = 'gravity-topology';
          } else if (line.flowTo !== downstreamNodeId) {
            line.flowConflict = true;
          }
          if (!visitedDownstreamNodes.has(upstreamNodeId)) {
            visitedDownstreamNodes.add(upstreamNodeId);
            downstreamQueue.push(upstreamNodeId);
          }
        });
      }

      const normalizedRouteEdges = lineDefs
        .filter(line =>
          line.elementType === 'collector'
          && nodesById.get(line.from)?.elementType === 'chamber'
          && nodesById.get(line.to)?.elementType === 'chamber'
        )
        .map(line => ({ lineId: line.id, from: line.from, to: line.to }));
      routeEdges.splice(0, routeEdges.length, ...normalizedRouteEdges);
    }

    function validateAallModel() {
      const errors = [];
      const warnings = [];
      const sumpCountByChamber = new Map();

      nodeDefs.forEach(node => {
        if (node.identifierRequired && !String(node.displayName || '').trim()) {
          errors.push(`${getNodeTypeLabel(node)} ${node.id}: falta el ID obligatorio.`);
        }

      lineDefs.forEach(line => {
        const from = nodeMap.get(line.from);
        const to = nodeMap.get(line.to);
        if (!from || !to) {
          errors.push(`${line.id}: uno de sus puntos de conexión no existe.`);
          return;
        }
        if (!hasKnownLength(line)) warnings.push(`${line.id}: falta la longitud obligatoria.`);
        if (line.flowConflict) errors.push(`${line.id}: la flecha de flujo contradice el sentido por gravedad del tirante.`);

        const endpointTypes = new Set([from.elementType, to.elementType]);
        if (line.elementType === 'collector') {
          const valid = endpointTypes.size === 1
            ? endpointTypes.has('chamber')
            : endpointTypes.has('chamber') && endpointTypes.has('discharge');
          if (!valid) errors.push(`${line.id}: un colector debe unir cámaras o terminar en una descarga.`);
        } else if (line.elementType === 'tie') {
          const chamberToSump = endpointTypes.has('chamber') && endpointTypes.has('sump');
          const sumpToSump = endpointTypes.size === 1 && endpointTypes.has('sump');
          const valid = chamberToSump || sumpToSump;
          if (!valid) {
            errors.push(`${line.id}: un tirante debe unir una cámara con un sumidero o dos sumideros consecutivos.`);
          }
          if (chamberToSump) {
            const chamber = from.elementType === 'chamber' ? from : to;
            const sump = from.elementType === 'sump' ? from : to;
            if (line.flowFrom !== sump.id || line.flowTo !== chamber.id) {
              errors.push(`${line.id}: el flujo del tirante debe ir del sumidero hacia la cámara.`);
            }
            sumpCountByChamber.set(chamber.id, (sumpCountByChamber.get(chamber.id) || 0) + 1);
          } else if (sumpToSump) {
            const validFlow = line.flowFrom && line.flowTo
              && line.flowFrom !== line.flowTo
              && [from.id, to.id].includes(line.flowFrom)
              && [from.id, to.id].includes(line.flowTo);
            if (!validFlow) {
              errors.push(`${line.id}: falta definir el sentido del tirante entre sumideros.`);
            }
          }
        }
      });

      sumpCountByChamber.forEach((count, chamberId) => {
        if (count > 5) warnings.push(`${chamberId}: tiene ${count} sumideros; es válido, pero supera la cantidad práctica habitual de 5.`);
      });

      nodeDefs.filter(node => node.elementType === 'discharge').forEach(discharge => {

          line.elementType === 'collector' && (line.from === discharge.id || line.to === discharge.id)

          }
        });
      });

      return { ok: errors.length === 0, errors, warnings };

    function lengths(totalMeters) {
      const total = Number(totalMeters);
      if (!Number.isFinite(total) || total <= 0) return [null];
      const tubeModule = NETWORK_DEFINITION.visualizationRules.tubeModuleMeters;
      const full = Math.floor(total / tubeModule);
      const remainder = Number((total - full * tubeModule).toFixed(2));
      const result = Array(full).fill(tubeModule);
      if (remainder > 0.000001) result.push(remainder);
      if (!result.length) result.push(total);
      return result;
    }

    function collectorSegmentsRunAgainstPath(definition) {
      if (definition?.elementType !== 'collector') return false;
      const downstreamNodeId = definition.flowTo
        || ([definition.from, definition.to].find(nodeId =>
          nodeMap.get(nodeId)?.elementType === 'discharge'
        ) || null);
      return downstreamNodeId === definition.to;
    }

    function segmentLengthsForLine(definition) {
      if (definition.kind === 'branch') return [Number(definition.meters)];
      const modules = lengths(definition.meters);
      return collectorSegmentsRunAgainstPath(definition) ? modules.reverse() : modules;
    }

    function poly(measure, startLen, endLen, overlap=0) {
      const total = measure.getTotalLength();
      const safeStart = Math.max(0, startLen - overlap);
      const safeEnd = Math.min(total, endLen + overlap);
      const visible = Math.max(safeEnd - safeStart, 0.001);
      const samples = Math.max(10, Math.ceil(visible / 8));
      const points = [];
      for (let i=0; i<=samples; i++) {
        const l = safeStart + visible * (i / samples);
        const p = measure.getPointAtLength(l);
        points.push([p.x, p.y]);
      }
      return points.map(([x,y], i) => `${i===0?'M':'L'}${x} ${y}`).join(' ');
    }

    function visibleLinePath(def) {
      const fullMeasure = E('path', { d:def.d, fill:'none', stroke:'none' });
      svg.appendChild(fullMeasure);
      const total = fullMeasure.getTotalLength();
      if (total <= 0.001) {
        fullMeasure.remove();
        return def.d;
      }

      const startRadius = Math.max(0, Number(nodeMap.get(def.from)?.radius) || 0);
      const endRadius = Math.max(0, Number(nodeMap.get(def.to)?.radius) || 0);
      const maximumTrim = Math.max(0, total - 0.001);
      const requestedTrim = startRadius + endRadius;
      const trimScale = requestedTrim > maximumTrim && requestedTrim > 0 ? maximumTrim / requestedTrim : 1;
      const visibleStart = startRadius * trimScale;
      const visibleEnd = total - endRadius * trimScale;
      const visiblePath = poly(fullMeasure, visibleStart, visibleEnd, 0);
      fullMeasure.remove();
      return visiblePath;
    }

    function addDistanceLabel(measure, def) {
      if (!hasKnownLength(def)) return null;
      const total = measure.getTotalLength();
      const m = total / 2;
      const textValue = `${formatLength(def.meters)} m`;
      const width = Math.max(34, textValue.length * 7.8);
      let p = measure.getPointAtLength(m);
      let before = measure.getPointAtLength(Math.max(0, m - 2));
      let after = measure.getPointAtLength(Math.min(total, m + 2));
      let ang = Math.atan2(after.y - before.y, after.x - before.x);
      let x;
      let y;

      const branchGeometry = getBranchLabelGeometry(def);
      if (branchGeometry) {
        const { anchor, outer } = branchGeometry;
        const dx = outer.x - anchor.x;
        const dy = outer.y - anchor.y;
        const magnitude = Math.hypot(dx, dy) || 1;
        const ux = dx / magnitude;
        const uy = dy / magnitude;
        const outerRadius = Math.max(6, Number(outer.radius) || 0);
        const clearance = outerRadius + width / 2 + 2;
        ang = Math.atan2(uy, ux);
        // La longitud del tirante se muestra después del sumidero, sobre la
        // prolongación de su eje. Así nunca interrumpe colectores en la cámara.
        x = outer.x + ux * clearance;
        y = outer.y + uy * clearance;
      } else {
        const nx = -Math.sin(ang);
        const ny = Math.cos(ang);
        x = p.x + nx * -14;
        y = p.y + ny * -14;
      }

      let deg = ang * 180 / Math.PI;
      if (deg > 90 || deg < -90) deg += 180;
      const group = E('g', {
        class: 'distance-group',
        transform: `rotate(${deg} ${x} ${y})`,
        'data-line-id': def.id,
        'data-label-outer-node-id': branchGeometry?.outer?.id || '',
        role: 'button',
        'aria-label': `Longitud total de ${getLineDisplayName(def)}: ${textValue}`
      });
      const hit = E('rect', { class: 'distance-hit', x: x - width/2, y: y - 10, width, height: 20, rx: 5, ry: 5 });
      const label = E('text', { class: `distance-text ${def.kind}`, x, y });
      label.textContent = textValue;
      let timer = null;
      let lastTap = 0;
      group.addEventListener('pointerup', (event) => {
        if (commentPlacementMode) return;
        event.preventDefault();
        event.stopPropagation();
        if (shouldSuppressTap(event)) return;
        const now = Date.now();
        if (now - lastTap <= DOUBLE_TAP_DELAY) {
          if (timer) clearTimeout(timer);
          timer = null;
          lastTap = 0;
          openAttributes(def.id);
          return;
        }
        lastTap = now;
        timer = setTimeout(() => { timer = null; }, DOUBLE_TAP_DELAY);
      });
      group.append(hit, label);
      distanceLabelsGroup.appendChild(group);
      return group;
    }

    function addSegmentGuides(measure, def, segmentLengths) {
      const group = E('g', { class: 'segment-guides', 'data-line-id': def.id });
      segmentGuidesGroup.appendChild(group);
      if (!hasKnownLength(def)) return group;

      // Las guías y el avance deben compartir el mismo orden de módulos.
      // En AALL esto conserva el sobrante aguas arriba, junto a la cámara.
      const lens = Array.isArray(segmentLengths)
        ? segmentLengths
        : segmentLengthsForLine(def);
      const total = measure.getTotalLength();
      let acc = 0;
      for (let i=0; i<lens.length-1; i++) {
        acc += lens[i];
        const l = total * (acc / def.meters);
        const p = measure.getPointAtLength(l);
        const before = measure.getPointAtLength(Math.max(0, l - 1.5));
        const after = measure.getPointAtLength(Math.min(total, l + 1.5));
        const dx = after.x - before.x, dy = after.y - before.y;
        const d = Math.hypot(dx, dy) || 1;
        const nx = -dy / d, ny = dx / d;
        const half = def.kind === 'collector' ? 6 : 4.8;
        const tick = E('line', { class: 'segment-guide', x1: p.x - nx*half, y1: p.y - ny*half, x2: p.x + nx*half, y2: p.y + ny*half });
        group.appendChild(tick);
      }
      return group;
    }

    function getBranchStretchFactor() {
      const widthRatio = currentViewBox.width / INITIAL_VIEW_BOX.width;
      const minimumRatio = MIN_VIEW_BOX_WIDTH / INITIAL_VIEW_BOX.width;
      const progress = Math.max(0, Math.min(1,
        (BRANCH_STRETCH_START_RATIO - widthRatio) / (BRANCH_STRETCH_START_RATIO - minimumRatio)
      ));
      return 1 + BRANCH_STRETCH_MAX * progress;
    }

    function getBranchStretchGeometry(definition) {
      if (!definition || definition.kind !== 'branch') return null;
      const fromNode = nodeMap.get(definition.from);
      const toNode = nodeMap.get(definition.to);
      if (fromNode?.elementType === 'chamber' && toNode) return { anchor: fromNode, outer: toNode };
      if (toNode?.elementType === 'chamber' && fromNode) return { anchor: toNode, outer: fromNode };
      return null;
    }

    function getBranchLabelGeometry(definition) {
      const chamberGeometry = getBranchStretchGeometry(definition);
      if (chamberGeometry) return chamberGeometry;
      if (!definition || definition.kind !== 'branch') return null;

      const fromNode = nodeMap.get(definition.from);
      const toNode = nodeMap.get(definition.to);
      if (!fromNode || !toNode) return null;
      const branchDegree = nodeId => lineDefs.filter(line =>
        line.kind === 'branch' && (line.from === nodeId || line.to === nodeId)
      ).length;
      const fromDegree = branchDegree(fromNode.id);
      const toDegree = branchDegree(toNode.id);
      return fromDegree <= toDegree
        ? { anchor: toNode, outer: fromNode }
        : { anchor: fromNode, outer: toNode };
    }

    function pointFallsInsideRotatedLabel(point, center, angle, halfWidth, halfHeight) {
      const dx = point.x - center.x;
      const dy = point.y - center.y;
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      const localX = dx * cos + dy * sin;
      const localY = -dx * sin + dy * cos;
      return Math.abs(localX) <= halfWidth && Math.abs(localY) <= halfHeight;
    }

    function stretchedLabelCenter(label, factor) {
      if (!label.stretchGeometry) return label.center;
      const { anchor, outer } = label.stretchGeometry;
      return {
        x: label.center.x + (outer.x - anchor.x) * (factor - 1),
        y: label.center.y + (outer.y - anchor.y) * (factor - 1)
      };
    }

    function rotatedLabelsOverlap(first, second, factor, padding = 2) {
      const firstCenter = stretchedLabelCenter(first, factor);
      const secondCenter = stretchedLabelCenter(second, factor);
      const firstAxes = [
        { x: Math.cos(first.angle), y: Math.sin(first.angle) },
        { x: -Math.sin(first.angle), y: Math.cos(first.angle) }
      ];
      const secondAxes = [
        { x: Math.cos(second.angle), y: Math.sin(second.angle) },
        { x: -Math.sin(second.angle), y: Math.cos(second.angle) }
      ];
      const centerDelta = {
        x: secondCenter.x - firstCenter.x,
        y: secondCenter.y - firstCenter.y
      };
      const projectionRadius = (label, axis, axes) =>
        label.halfWidth * Math.abs(axis.x * axes[0].x + axis.y * axes[0].y)
        + label.halfHeight * Math.abs(axis.x * axes[1].x + axis.y * axes[1].y);

      return [...firstAxes, ...secondAxes].every(axis => {
        const distance = Math.abs(centerDelta.x * axis.x + centerDelta.y * axis.y);
        const firstRadius = projectionRadius(first, axis, firstAxes);
        const secondRadius = projectionRadius(second, axis, secondAxes);
        return distance <= firstRadius + secondRadius + padding;
      });
    }

    function buildBranchLabelPathSamples(factors) {
      return factors.map(factor => [...lineStates.values()].map(state => {
        const points = [];
        const total = state.totalSvgLength;
        const step = Math.max(1.5, total / 140);
        for (let length = 0; length <= total + 0.001; length += step) {
          const rawPoint = state.measurePath.getPointAtLength(Math.min(length, total));
          points.push(stretchBranchPoint(state.definition, rawPoint, factor));
        }
        return {
          lineId: state.definition.id,
          kind: state.definition.kind,
          points
        };
      }));
    }

    function scoreBranchDistanceCandidate(
      definition,
      geometry,
      center,
      angle,
      width,
      placedLabels,
      factors,
      sampledPathsByFactor
    ) {
      const ownStretchGeometry = getBranchStretchGeometry(definition);
      let score = 0;
      const candidateLabel = {
        center,
        angle,
        halfWidth: width / 2 + 2,
        halfHeight: 8,
        stretchGeometry: ownStretchGeometry
      };

      factors.forEach((factor, factorIndex) => {
        const candidate = ownStretchGeometry
          ? {
              x: center.x + (geometry.outer.x - geometry.anchor.x) * (factor - 1),
              y: center.y + (geometry.outer.y - geometry.anchor.y) * (factor - 1)
            }
          : center;

        sampledPathsByFactor[factorIndex].forEach(pathSample => {
          if (pathSample.lineId === definition.id) return;
          const overlaps = pathSample.points.some(point =>
            pointFallsInsideRotatedLabel(point, candidate, angle, width / 2 + 3, 9)
          );
          if (overlaps) score += pathSample.kind === 'collector' ? 10000 : 2500;
        });

        placedLabels.forEach(placedLabel => {
          if (rotatedLabelsOverlap(candidateLabel, placedLabel, factor)) score += 6000;
        });
      });
      return score;
    }

    function layoutBranchDistanceLabels() {
      const placedLabels = [];
      const factors = [1, 1 + BRANCH_STRETCH_MAX / 2, 1 + BRANCH_STRETCH_MAX];
      const sampledPathsByFactor = buildBranchLabelPathSamples(factors);
      const branchStates = [...lineStates.values()]
        .filter(state => state.definition.kind === 'branch' && state.distanceGroup)
        .sort((first, second) => {
          const firstAnchor = getBranchLabelGeometry(first.definition)?.anchor?.id;
          const secondAnchor = getBranchLabelGeometry(second.definition)?.anchor?.id;
          const degree = nodeId => lineDefs.filter(line =>
            line.kind === 'branch' && (line.from === nodeId || line.to === nodeId)
          ).length;
          return degree(secondAnchor) - degree(firstAnchor);
        });

      branchStates.forEach(state => {
        const definition = state.definition;
        const geometry = getBranchLabelGeometry(definition);
        if (!geometry) return;

        const dx = geometry.outer.x - geometry.anchor.x;
        const dy = geometry.outer.y - geometry.anchor.y;
        const magnitude = Math.hypot(dx, dy) || 1;
        const ux = dx / magnitude;
        const uy = dy / magnitude;
        const nx = -uy;
        const ny = ux;
        const angle = Math.atan2(uy, ux);
        const hit = state.distanceGroup.querySelector('.distance-hit');
        const text = state.distanceGroup.querySelector('.distance-text');
        const width = Number(hit?.getAttribute('width')) || 34;
        const outerRadius = Math.max(6, Number(geometry.outer.radius) || 0);
        const baseDistance = outerRadius + width / 2 + 2;
        const candidates = [];
        const sideOffsets = [0, 14, -14, 26, -26, 40, -40, 54, -54, 68, -68];
        const addOutsideCandidates = extraDistance => {
          sideOffsets.forEach(sideOffset => {
            candidates.push({
              x: geometry.outer.x + ux * (baseDistance + extraDistance) + nx * sideOffset,
              y: geometry.outer.y + uy * (baseDistance + extraDistance) + ny * sideOffset,
              extraDistance,
              sideOffset
            });
          });
        };
        addOutsideCandidates(0);

        // Si el exterior está ocupado, conserva el texto cerca del sumidero
        // colocándolo junto al tirante y manteniendo exactamente su dirección.
        const insideDistance = Math.min(width / 2 + 4, magnitude * 0.35);
        [18, -18, 28, -28, 40, -40].forEach(sideOffset => {
          candidates.push({
            x: geometry.outer.x - ux * insideDistance + nx * sideOffset,
            y: geometry.outer.y - uy * insideDistance + ny * sideOffset,
            extraDistance: 0,
            sideOffset
          });
        });

        // También puede ubicarse junto al propio tirante, cerca del sumidero.
        // La rotación no cambia: el texto continúa paralelo a la tubería.
        [0.72, 0.58].forEach(ratio => {
          [18, -18, 28, -28, 40, -40].forEach(sideOffset => {
            candidates.push({
              x: geometry.anchor.x + dx * ratio + nx * sideOffset,
              y: geometry.anchor.y + dy * ratio + ny * sideOffset,
              extraDistance: 0,
              sideOffset
            });
          });
        });
        [8, 16, 24].forEach(addOutsideCandidates);

        let best = candidates[0];
        let bestScore = Infinity;
        for (const candidate of candidates) {
          const collisionScore = scoreBranchDistanceCandidate(
            definition,
            geometry,
            candidate,
            angle,
            width,
            placedLabels,
            factors,
            sampledPathsByFactor
          );
          const candidateScore = collisionScore
            + candidate.extraDistance * 3
            + Math.abs(candidate.sideOffset);
          if (candidateScore < bestScore) {
            best = candidate;
            bestScore = candidateScore;
          }
          if (collisionScore === 0) break;
        }

        let degrees = angle * 180 / Math.PI;
        if (degrees > 90 || degrees < -90) degrees += 180;
        state.distanceGroup.setAttribute('transform', `rotate(${degrees} ${best.x} ${best.y})`);
        hit?.setAttribute('x', best.x - width / 2);
        hit?.setAttribute('y', best.y - 10);
        text?.setAttribute('x', best.x);
        text?.setAttribute('y', best.y);
        state.distanceGroupBaseTransform = state.distanceGroup.getAttribute('transform') || '';
        placedLabels.push({
          center: best,
          angle,
          halfWidth: width / 2 + 2,
          halfHeight: 8,
          stretchGeometry: getBranchStretchGeometry(definition)
        });
      });
    }

    function stretchBranchPoint(definition, point, factor = getBranchStretchFactor()) {
      const geometry = getBranchStretchGeometry(definition);
      if (!geometry || factor === 1) return { x: point.x, y: point.y };
      return {
        x: geometry.anchor.x + (point.x - geometry.anchor.x) * factor,
        y: geometry.anchor.y + (point.y - geometry.anchor.y) * factor
      };
    }

    function unstretchBranchPoint(definition, point, factor = getBranchStretchFactor()) {
      const geometry = getBranchStretchGeometry(definition);
      if (!geometry || factor === 1) return point;
      return {
        x: geometry.anchor.x + (point.x - geometry.anchor.x) / factor,
        y: geometry.anchor.y + (point.y - geometry.anchor.y) / factor
      };
    }

    function setShortSegmentSelectorTransform(group) {
      const scale = currentViewBox.width / INITIAL_VIEW_BOX.width;
      const definition = lineDefs.find(line => line.id === group.dataset.lineId);
      const anchor = stretchBranchPoint(definition, {
        x: Number(group.dataset.anchorX),
        y: Number(group.dataset.anchorY)
      });
      group.setAttribute('transform', `translate(${anchor.x} ${anchor.y}) scale(${scale})`);
    }

    function updateShortSegmentSelectorScale() {
      shortSegmentSelectorsGroup.querySelectorAll('.short-segment-selector').forEach(setShortSegmentSelectorTransform);
    }

    function addShortSegmentSelector(state, segmentIndex, startSvgLength, endSvgLength) {
      if (state.definition.kind === 'branch') return null;
      const segmentLength = Number(state.segmentLengths[segmentIndex]);
      if (!Number.isFinite(segmentLength) || segmentLength >= 4 - 0.000001) return null;

      const selectorPosition = startSvgLength + (endSvgLength - startSvgLength) * 0.15;
      const point = state.measurePath.getPointAtLength(selectorPosition);
      const before = state.measurePath.getPointAtLength(Math.max(0, selectorPosition - 2));
      const after = state.measurePath.getPointAtLength(Math.min(state.totalSvgLength, selectorPosition + 2));
      const dx = after.x - before.x;
      const dy = after.y - before.y;
      const magnitude = Math.hypot(dx, dy) || 1;
      const nx = -dy / magnitude;
      const ny = dx / magnitude;
      const labelX = nx * 46;
      const labelY = ny * 46;
      const group = E('g', {
        class: 'short-segment-selector',
        'data-line-id': state.definition.id,
        'data-segment-index': segmentIndex,
        role: 'button',
        tabindex: '0',
        'aria-label': `Marcar tramo corto de ${formatLength(segmentLength)} metros en ${getLineDisplayName(state.definition)}`
      });
      group.dataset.anchorX = point.x.toFixed(2);
      group.dataset.anchorY = point.y.toFixed(2);

      const leader = E('line', {
        class: 'short-segment-leader',
        x1: nx * 5,
        y1: ny * 5,
        x2: nx * 34,
        y2: ny * 34
      });
      const hit = E('rect', {
        class: 'short-segment-hit',
        x: labelX - 38,
        y: labelY - 22,
        width: 76,
        height: 44,
        rx: 10,
        ry: 10
      });
      const pill = E('rect', {
        class: 'short-segment-pill',
        x: labelX - 27,
        y: labelY - 11,
        width: 54,
        height: 22,
        rx: 7,
        ry: 7
      });
      const text = E('text', { class: 'short-segment-text', x: labelX, y: labelY });
      text.textContent = `${formatLength(segmentLength)} m`;

      const toggle = event => {
        if (commentPlacementMode) return;
        event.preventDefault();
        event.stopPropagation();
        toggleManualSegment(state.definition.id, segmentIndex);
      };
      group.addEventListener('pointerdown', event => {
        if (commentPlacementMode) return;
        event.preventDefault();
        event.stopPropagation();
      });
      group.addEventListener('pointerup', toggle);
      group.addEventListener('keydown', event => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        toggle(event);
      });
      group.append(leader, hit, pill, text);
      shortSegmentSelectorsGroup.appendChild(group);
      setShortSegmentSelectorTransform(group);
      return group;
    }

    function applyBranchStretch() {
      const factor = getBranchStretchFactor();
      lineStates.forEach(state => {
        const geometry = getBranchStretchGeometry(state.definition);
        if (!geometry) return;

        const { anchor, outer } = geometry;
        const scaleTransform = factor === 1
          ? ''
          : `translate(${anchor.x} ${anchor.y}) scale(${factor}) translate(${-anchor.x} ${-anchor.y})`;
        [
          state.basePath,
          state.fullOverlay,
          state.hitPath,
          state.guideGroup,
          ...state.segmentOverlays
        ].forEach(element => {
          if (!element) return;
          if (scaleTransform) element.setAttribute('transform', scaleTransform);
          else element.removeAttribute('transform');
        });

        const outerDx = (outer.x - anchor.x) * (factor - 1);
        const outerDy = (outer.y - anchor.y) * (factor - 1);
        if (state.distanceGroup) {
          const baseTransform = state.distanceGroupBaseTransform || '';
          state.distanceGroup.setAttribute(
            'transform',
            factor === 1
              ? baseTransform
              : `translate(${outerDx} ${outerDy}) ${baseTransform}`.trim()
          );
        }

        if (outer.elementType === 'sump') {
          const nodeElement = nodesGroup.querySelector(`[data-node-id="${outer.id}"]`);
          const labelElement = labelsGroup.querySelector(`[data-node-id="${outer.id}"]`);
          const translation = factor === 1 ? '' : `translate(${outerDx} ${outerDy})`;
          if (nodeElement) {
            if (translation) nodeElement.setAttribute('transform', translation);
            else nodeElement.removeAttribute('transform');
          }
          if (labelElement) {
            if (translation) labelElement.setAttribute('transform', translation);
            else labelElement.removeAttribute('transform');
          }
        }
      });
      updateShortSegmentSelectorScale();
    }

    function applyViewBox() {
      svg.setAttribute('viewBox', `${currentViewBox.x} ${currentViewBox.y} ${currentViewBox.width} ${currentViewBox.height}`);
      applyBranchStretch();
      updateGuideVisibility();
    }

    function updateGuideVisibility() {
      const show = currentViewBox.width <= INITIAL_VIEW_BOX.width * GUIDE_VISIBILITY_RATIO;
      document.querySelectorAll('.segment-guides').forEach(g => g.classList.toggle('visible', show));
      shortSegmentSelectorsGroup.classList.toggle('visible', show);
      updateShortSegmentSelectorScale();
    }

    function clampViewBox() {
      const aspect = INITIAL_VIEW_BOX.height / INITIAL_VIEW_BOX.width;
      currentViewBox.width = Math.min(MAX_VIEW_BOX_WIDTH, Math.max(MIN_VIEW_BOX_WIDTH, currentViewBox.width));
      currentViewBox.height = currentViewBox.width * aspect;
      const hMargin = currentViewBox.width * 0.35;
      const vMargin = currentViewBox.height * 0.35;
      const minX = INITIAL_VIEW_BOX.x - hMargin;
      const maxX = INITIAL_VIEW_BOX.x + INITIAL_VIEW_BOX.width - currentViewBox.width + hMargin;
      const minY = INITIAL_VIEW_BOX.y - vMargin;
      const maxY = INITIAL_VIEW_BOX.y + INITIAL_VIEW_BOX.height - currentViewBox.height + vMargin;
      currentViewBox.x = Math.min(Math.max(currentViewBox.x, Math.min(minX,maxX)), Math.max(minX,maxX));
      currentViewBox.y = Math.min(Math.max(currentViewBox.y, Math.min(minY,maxY)), Math.max(minY,maxY));
    }

    function clientToSvg(clientX, clientY) {
      const p = svg.createSVGPoint(); p.x = clientX; p.y = clientY;
      const m = svg.getScreenCTM();
      if (!m) return { x: currentViewBox.x + currentViewBox.width/2, y: currentViewBox.y + currentViewBox.height/2 };
      return p.matrixTransform(m.inverse());
    }

    function zoomAroundPoint(factor, center) {
      const prevW = currentViewBox.width;
      const boundedW = Math.min(MAX_VIEW_BOX_WIDTH, Math.max(MIN_VIEW_BOX_WIDTH, prevW * factor));
      const actual = boundedW / prevW;
      currentViewBox.x = center.x - (center.x - currentViewBox.x) * actual;
      currentViewBox.y = center.y - (center.y - currentViewBox.y) * actual;
      currentViewBox.width = boundedW; currentViewBox.height *= actual;
      clampViewBox(); applyViewBox();
    }

    function resetView() { currentViewBox = { ...INITIAL_VIEW_BOX }; applyViewBox(); }

    function isInteractiveTarget(target) {
      return Boolean(target.closest('.hit, .node, .node-label, .distance-group, .short-segment-selector, .comment-marker, .zoom-btn, .model-filter-ui, .model-filter-overlay, .model-records-overlay'));
    }

    function markPointerMoved(pointer) {
      const dist = Math.hypot(pointer.clientX - pointer.startX, pointer.clientY - pointer.startY);
      if (dist > 6) { pointer.moved = true; suppressTapUntil = Date.now() + 350; }
    }

    function shouldSuppressTap(event) {
      const p = activePointers.get(event.pointerId);
      return Date.now() < suppressTapUntil || multiTouchGesture || Boolean(p && p.moved);
    }

    function setupZoomPan() {
      const emptyDoubleTapMaxDistance = 32;
      const emptyDoubleTapZoomFactor = 0.5;
      let lastEmptyTapTime = 0;
      let lastEmptyTapX = 0;
      let lastEmptyTapY = 0;

      fitViewButton.addEventListener('click', resetView);
      svg.addEventListener('dblclick', event => event.preventDefault(), { passive:false });
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {
        viewport.addEventListener(type, event => event.preventDefault(), { passive:false });
      });

      svg.addEventListener('pointerdown', (event) => {
        if (isInteractiveTarget(event.target)) lastEmptyTapTime = 0;
      }, { capture:true });

      svg.addEventListener('pointerdown', (event) => {
        const pointer = { pointerId:event.pointerId, clientX:event.clientX, clientY:event.clientY, lastX:event.clientX, lastY:event.clientY, startX:event.clientX, startY:event.clientY, moved:false, canPan:!isInteractiveTarget(event.target) };
        activePointers.set(event.pointerId, pointer);
        if (activePointers.size === 1 && pointer.canPan) { panPointerId = event.pointerId; viewport.classList.add('panning'); try { svg.setPointerCapture(event.pointerId); } catch {} }
        if (activePointers.size === 2) {
          multiTouchGesture = true; panPointerId = null; viewport.classList.add('panning');
          const pts = [...activePointers.values()];
          pinchDistance = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
          pts.forEach(item => { try { svg.setPointerCapture(item.pointerId); } catch {} });
        }
      });

      svg.addEventListener('pointermove', (event) => {
        const pointer = activePointers.get(event.pointerId); if (!pointer) return;
        pointer.clientX = event.clientX; pointer.clientY = event.clientY; markPointerMoved(pointer);
        if (activePointers.size >= 2) {
          event.preventDefault(); multiTouchGesture = true; suppressTapUntil = Date.now() + 400;
          const pts = [...activePointers.values()].slice(0,2);
          const newDist = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
          if (pinchDistance && newDist > 0) {
            const center = clientToSvg((pts[0].clientX + pts[1].clientX)/2, (pts[0].clientY + pts[1].clientY)/2);
            zoomAroundPoint(pinchDistance / newDist, center);
          }
          pinchDistance = newDist; pts.forEach(item => { item.lastX = item.clientX; item.lastY = item.clientY; }); return;
        }
        if (panPointerId === event.pointerId && pointer.canPan) {
          event.preventDefault();
          const previousPoint = clientToSvg(pointer.lastX, pointer.lastY);
          const currentPoint = clientToSvg(pointer.clientX, pointer.clientY);
          currentViewBox.x -= currentPoint.x - previousPoint.x;
          currentViewBox.y -= currentPoint.y - previousPoint.y;
          clampViewBox(); applyViewBox();
          pointer.lastX = pointer.clientX; pointer.lastY = pointer.clientY;
        }
      });

      function finishPointer(event) {
        const pointer = activePointers.get(event.pointerId); if (pointer) markPointerMoved(pointer);
        activePointers.delete(event.pointerId);
        if (panPointerId === event.pointerId) panPointerId = null;
        if (activePointers.size < 2) pinchDistance = null;
        if (activePointers.size === 0) { multiTouchGesture = false; viewport.classList.remove('panning'); }
      }
      svg.addEventListener('pointerup', finishPointer);
      svg.addEventListener('pointercancel', finishPointer);
      svg.addEventListener('pointerleave', (event) => { if (activePointers.has(event.pointerId)) finishPointer(event); });
      svg.addEventListener('wheel', (event) => {
        event.preventDefault();
        const deltaModeScale = event.deltaMode === 1
          ? 16
          : event.deltaMode === 2
            ? viewport.clientHeight
            : 1;
        const normalizedDelta = event.deltaY * deltaModeScale;
        const limitedDelta = Math.max(-120, Math.min(120, normalizedDelta));
        const factor = Math.exp(limitedDelta * 0.0015);
        zoomAroundPoint(factor, clientToSvg(event.clientX, event.clientY));
      }, { passive:false });
      svg.addEventListener('pointerup', (event) => {
        if (commentPlacementMode || event.button !== 0 || event.isPrimary === false || isInteractiveTarget(event.target) || shouldSuppressTap(event)) {
          lastEmptyTapTime = 0;
          return;
        }

        const now = Date.now();
        const closeInTime = now - lastEmptyTapTime <= DOUBLE_TAP_DELAY;
        const closeInSpace = Math.hypot(event.clientX - lastEmptyTapX, event.clientY - lastEmptyTapY) <= emptyDoubleTapMaxDistance;
        if (closeInTime && closeInSpace) {
          event.preventDefault();
          lastEmptyTapTime = 0;
          suppressTapUntil = now + 350;
          zoomAroundPoint(emptyDoubleTapZoomFactor, clientToSvg(event.clientX, event.clientY));
          return;
        }

        lastEmptyTapTime = now;
        lastEmptyTapX = event.clientX;
        lastEmptyTapY = event.clientY;
      });
    }

    function closestLengthOnPath(path, target) {
      const total = path.getTotalLength();
      const coarse = 120;
      let best = 0, bestDist = Infinity;
      for (let i=0; i<=coarse; i++) {
        const len = total * (i / coarse); const p = path.getPointAtLength(len);
        const dist = (p.x-target.x)**2 + (p.y-target.y)**2;
        if (dist < bestDist) { bestDist = dist; best = len; }
      }
      let radius = total / coarse;
      for (let it=0; it<12; it++) {
        for (const len of [Math.max(0,best-radius), Math.min(total,best+radius)]) {
          const p = path.getPointAtLength(len); const dist = (p.x-target.x)**2 + (p.y-target.y)**2;
          if (dist < bestDist) { bestDist = dist; best = len; }
        }
        radius /= 2;
      }
      return best;
    }

    function getSegmentIndexAtLength(state, selectedSvgLength) {
      if (!hasKnownLength(state.definition)) return 0;
      const lastIndex = state.segmentLengths.length - 1;
      const remainder = Number((state.definition.meters % 6).toFixed(2));
      if (remainder > 0 && lastIndex > 0) {
        const actualRemSvg = state.totalSvgLength * (remainder / state.definition.meters);
        const touchStart = Math.max(0, state.totalSvgLength - Math.max(MIN_REMAINDER_TOUCH_LENGTH, actualRemSvg));
        if (selectedSvgLength >= touchStart) return lastIndex;
      }
      const selectedMeters = state.definition.meters * (selectedSvgLength / state.totalSvgLength);
      let acc = 0;
      for (let i=0; i<state.segmentLengths.length; i++) {
        acc += state.segmentLengths[i];
        if (selectedMeters < acc || i === state.segmentLengths.length - 1) return i;
      }
      return lastIndex;
    }

    function isSegmentActive(state, index) { return state.activitySegmentCount[index] > 0; }
    function refreshSegment(state, index) {
      const active = isSegmentActive(state, index);
      state.segmentOverlays[index].classList.toggle('active', active);
      state.shortSegmentSelectors[index]?.classList.toggle('active', active);
    }
    function refreshFullLine(state) { state.fullOverlay.classList.toggle('active', state.segmentOverlays.every((_,i)=>isSegmentActive(state,i))); }
    function refreshLine(state) { state.segmentOverlays.forEach((_,i)=>refreshSegment(state,i)); refreshFullLine(state); }

    function getManualEndpoints(lineId) {
      const d = lineDefs.find(line => line.id === lineId);
      return d ? { start:d.from, end:d.to } : { start:'?', end:'?' };
    }

    function findManualActivity(lineId, segmentIndex) {
      return activities.find(a =>
        a.source === 'manual' &&
        Array.isArray(a.appliedSegments) &&
        a.appliedSegments.some(segment => segment.lineId === lineId && segment.segmentIndex === segmentIndex)
      );
    }

    function createManualActivity(lineId, segmentIndex) {
      const state = lineStates.get(lineId);
      const rawLength = state.segmentLengths[segmentIndex];
      const segmentLength = Number.isFinite(Number(rawLength)) ? Number(rawLength) : null;
      const endpoints = getManualEndpoints(lineId);
      return {
        id: (crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`),
        source: 'manual',
        segmentOrderVersion: ACTIVITY_SEGMENT_ORDER_VERSION,
        startCamera: endpoints.start,
        endCamera: endpoints.end,
        length: segmentLength,
        appliedLength: segmentLength,
        appliedSegments: [{ lineId, segmentIndex, segmentLength }],
        date: ''
      };
    }

    function createManualGroup(template, segments, id=null) {
      const ordered = [...segments].sort((a,b) => a.segmentIndex - b.segmentIndex);
      const endpoints = getManualEndpoints(ordered[0]?.lineId);
      const knownLengths = ordered.map(segment => Number(segment.segmentLength)).filter(Number.isFinite);
      const appliedLength = knownLengths.length === ordered.length
        ? Number(knownLengths.reduce((sum, value) => sum + value, 0).toFixed(2))
        : null;
      return {
        ...template,
        id: id || (crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`),
        source: 'manual',
        startCamera: endpoints.start,
        endCamera: endpoints.end,
        length: appliedLength,
        appliedLength,
        appliedSegments: ordered.map(segment => ({ ...segment }))
      };
    }

    function splitConsecutiveSegments(segments) {
      const ordered = [...segments].sort((a,b) =>
        String(a.lineId).localeCompare(String(b.lineId)) || a.segmentIndex - b.segmentIndex
      );
      const groups = [];
      ordered.forEach(segment => {
        const current = groups[groups.length - 1];
        const previous = current?.[current.length - 1];
        if (!current || previous.lineId !== segment.lineId || segment.segmentIndex !== previous.segmentIndex + 1) {
          groups.push([segment]);
        } else {
          current.push(segment);
        }
      });
      return groups;
    }

    function toggleManualSegment(lineId, segmentIndex) {
      const existing = findManualActivity(lineId, segmentIndex);
      if (existing) {
        const activityIndex = activities.indexOf(existing);
        const remaining = existing.appliedSegments.filter(segment =>
          segment.lineId !== lineId || segment.segmentIndex !== segmentIndex
        );
        const replacements = splitConsecutiveSegments(remaining).map((segments, index) =>
          createManualGroup(existing, segments, index === 0 ? existing.id : null)
        );
        selectedActivityIds.delete(existing.id);
        activities.splice(activityIndex, 1, ...replacements);
      } else {
        activities.push(createManualActivity(lineId, segmentIndex));
      }
      saveActivities(); rebuildActivityMarks(); renderActivities();
    }

    function todayInputDate() { const now = new Date(); const local = new Date(now.getTime() - now.getTimezoneOffset()*60000); return local.toISOString().slice(0,10); }
