  <text x="700" y="155" text-anchor="middle" class="hand title">Entregables para Codex</text>
  <path d="M410 176 Q700 188 990 175" fill="none" stroke="#ff2020" stroke-width="5" stroke-linecap="round"/>

  <!-- Entregable 1 -->
  <circle cx="169" cy="241" r="32" fill="none" stroke="#163ed1" stroke-width="4"/>
  <text x="169" y="253" text-anchor="middle" class="number">1</text>
  <text x="222" y="251" class="hand section">PDF en alta calidad</text>

  <text x="170" y="317" class="hand body">
    <tspan x="170" dy="0">• Tuberías y tirantes con sus colores:</tspan>
    <tspan x="215" dy="45">azul para mayor jerarquía y rojo para menor jerarquía.</tspan>
    <tspan x="170" dy="58">• Cámaras, sumideros, muros de ala, etc.</tspan>
    <tspan x="170" dy="58">• Linderos del terreno en color verde.</tspan>
    <tspan x="170" dy="58">• Puntos enumerados en color magenta.</tspan>
    <tspan x="215" dy="45">Estos puntos servirán luego para georreferenciar el sistema.</tspan>
  </text>

  <path d="M165 619 Q700 631 1235 618" fill="none" stroke="#ff2020" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Entregable 2 -->
  <circle cx="169" cy="692" r="32" fill="none" stroke="#163ed1" stroke-width="4"/>
  <text x="169" y="704" text-anchor="middle" class="number">2</text>
  <text x="222" y="702" class="hand section">Documento de texto</text>

  <text x="170" y="769" class="hand body">
    <tspan x="170" dy="0">• Lista de los puntos con su misma enumeración.</tspan>
    <tspan x="170" dy="58">• Coordenadas correspondientes a cada punto.</tspan>
  </text>

