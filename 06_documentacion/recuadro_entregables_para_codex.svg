  <text x="700" y="935" text-anchor="middle" class="hand note" font-weight="600">Nota importante</text>
  <path d="M584 949 Q700 957 816 949" fill="none" stroke="#ff2020" stroke-width="3"/>
  <text x="196" y="989" class="hand note">
    <tspan x="196" dy="0">Aunque los linderos todavía no estén georreferenciados, se deben</tspan>
    <tspan x="196" dy="42">entregar usando el sistema local del CAD. Así, si después se obtienen</tspan>
    <tspan x="196" dy="42">las coordenadas reales, será posible georreferenciar todo el plano.</tspan>
  </text>
