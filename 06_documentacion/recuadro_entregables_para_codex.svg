<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1220" viewBox="0 0 1400 1220">
  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faint">
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <style>
      .hand { font-family: "Segoe Print", "Comic Sans MS", cursive; fill: #123fd0; }
      .title { font-size: 49px; font-weight: 600; }
      .section { font-size: 35px; font-weight: 600; }
      .body { font-size: 29px; }
      .note { font-size: 27px; fill: #128a2e; }
      .number { font-family: "Segoe Print", "Comic Sans MS", cursive; fill: #123fd0; font-size: 34px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1400" height="1220" fill="#fffefb" filter="url(#paper)"/>

